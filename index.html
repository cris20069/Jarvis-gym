<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1012">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jarvis Gym">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Jarvis Gym</title>
<style>
@font-face{font-family:"Big Shoulders Display";font-weight:800;font-display:swap;src:url(fonts/big-shoulders-display-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"Big Shoulders Display";font-weight:900;font-display:swap;src:url(fonts/big-shoulders-display-latin-900-normal.woff2) format("woff2")}
@font-face{font-family:"Geist";font-weight:400;font-display:swap;src:url(fonts/geist-sans-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Geist";font-weight:500;font-display:swap;src:url(fonts/geist-sans-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Geist";font-weight:600;font-display:swap;src:url(fonts/geist-sans-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Geist";font-weight:700;font-display:swap;src:url(fonts/geist-sans-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Geist Mono";font-weight:500;font-display:swap;src:url(fonts/geist-mono-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Geist Mono";font-weight:600;font-display:swap;src:url(fonts/geist-mono-latin-600-normal.woff2) format("woff2")}

/* Layout: dunkle Trainings-App. Riesige schmale Display-Schrift für Namen und Zahlen, ruhige Graphit-Karten,
   ein Akzent (wählbar: Rennrot, Kobalt, Smaragd), Gold nur für Rekorde, Grün nur für "erledigt". */
:root{
  color-scheme:dark;
  --bg:#0f1012;--surface:#15171a;--surface-2:#1c1f23;--sunk:#1c1f23;
  --line:#24272c;--line-2:#2f333a;
  --text:#f2f1ee;--mute:#8e9198;--dim:#5b5f67;
  --accent:#e0432f;--accent-ink:#fff6f3;--accent-soft:rgba(224,67,47,.14);
  --gold:#d9a441;--gold-soft:rgba(217,164,65,.14);
  --green:#4fbf87;--green-soft:rgba(79,191,135,.13);
  --danger:#ff6b5e;--danger-soft:rgba(255,107,94,.12);
  --slate:#5b5f67;
  /* alte Namen, die das Script noch benutzt */
  --red:var(--accent);--red-hi:var(--accent);--red-deep:var(--accent);--gold-hi:var(--gold);--cyan:var(--accent);--ink:var(--accent-ink);--on-accent:var(--accent-ink);
  --f-disp:"Big Shoulders Display","Arial Narrow",system-ui,sans-serif;
  --f-display:var(--f-disp);
  --f-body:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"Geist Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:18px;
}
:root[data-accent="kobalt"]{--accent:#4a6cf7;--accent-ink:#f4f6ff;--accent-soft:rgba(74,108,247,.16)}
:root[data-accent="smaragd"]{--accent:#2fa874;--accent-ink:#f1fff8;--accent-soft:rgba(47,168,116,.15)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:400 15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.eyebrow{font:600 11px/1.2 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
@media (prefers-reduced-motion:no-preference){#main>*{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}#main>*:nth-child(2){animation-delay:.04s}#main>*:nth-child(3){animation-delay:.08s}#main>*:nth-child(4){animation-delay:.12s}#main>*:nth-child(5){animation-delay:.16s}@keyframes rise{from{transform:translateY(12px);opacity:.3}}}

/* Kopf */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:20px 4px;padding-top:calc(20px + env(safe-area-inset-top,0px))}
.brand{display:flex;flex-direction:column-reverse;gap:4px;min-width:0}
.brand .k{font:600 11px/1.2 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.brand .n{font:900 44px/.85 var(--f-disp);text-transform:uppercase;letter-spacing:.005em}
.tr{display:flex;align-items:center;gap:10px;padding-bottom:4px}
.live{display:inline-flex;align-items:center;gap:6px;font:600 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--green);padding:7px 10px;border-radius:999px;background:var(--green-soft)}
.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green)}
.streak{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.streak b{font:900 32px/1 var(--f-disp)}
.streak span{font-size:12px;color:var(--mute)}

/* Abschnitte & Flächen */
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:28px 2px 10px}
.sec h2{margin:0;font:800 26px/1 var(--f-disp);text-transform:uppercase;letter-spacing:.01em}
.sec span{font:500 12px/1 var(--f-mono);color:var(--mute)}
.panel{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:grid;gap:12px}
.rowx{display:flex;align-items:center;justify-content:space-between;gap:12px}

/* Heute: Plan-Hero */
.plan-hero{margin-top:18px}
.plan-hero .eyebrow{color:var(--accent)}
.plan-hero h2{margin:4px 0 0;font:900 min(104px,26vw)/.8 var(--f-disp);text-transform:uppercase;letter-spacing:-.01em;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word}
.plan-hero h2 em{font-style:normal;color:var(--accent)}
.plan-hero p{margin:12px 0 0;color:var(--mute);max-width:34ch}
.plan-hero p b{color:var(--text);font-weight:600}
.ready{display:grid;gap:10px;margin-top:16px}
.ready .rowx b{font-weight:600}
.ready .rowx span{font-size:12px;color:var(--mute)}
.mus{display:grid;grid-template-columns:80px minmax(0,1fr) 42px;align-items:center;gap:10px;font-size:13px;color:var(--mute)}
.mus.on{color:var(--text)}
.mus .bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.mus .bar i{display:block;height:100%;border-radius:4px;background:var(--dim);transform-origin:left}
.mus.on .bar i{background:var(--accent)}
.mus .v{text-align:right}
@media (prefers-reduced-motion:no-preference){.mus .bar i{animation:grow .9s cubic-bezier(.2,.7,.2,1) both}@keyframes grow{from{transform:scaleX(.05)}}}
.tip{font-size:13px;color:var(--mute);border-top:1px solid var(--line);padding-top:10px}
.tip b{color:var(--text);font-weight:600}
.targets{margin-top:12px}
.targets .head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.targets .head b{font-weight:600}
.tg{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:baseline;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.tg:first-of-type{border-top:0}
.tg .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg .was{font-size:12px;color:var(--dim);text-decoration:line-through}
.tg .now{font-weight:600}
.tg .new{font-size:12px;color:var(--dim)}
.up{font:600 11px var(--f-mono);color:var(--accent);background:var(--accent-soft);padding:3px 7px;border-radius:999px;margin-left:6px}
.hold{position:relative;width:100%;height:64px;margin-top:14px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;gap:10px;font:700 17px var(--f-body);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;cursor:pointer;transition:transform .12s}
.hold:active{transform:scale(.985)}
.hold .fill{position:absolute;inset:0;background:rgba(255,255,255,.24);transform:scaleX(0);transform-origin:left}
.hold span{position:relative}
.hold-hint{text-align:center;font-size:12px;color:var(--dim);margin-top:6px}

/* Wochenkarte */
.weekcard{display:grid;gap:16px}
.wk-top{display:flex;align-items:center;gap:16px}
.reactor{display:grid;place-items:center;flex:none}
.reactor svg{width:104px;height:auto}
.tick,.core,.inner,.r-lbl{display:none}
.arc-track{stroke:var(--surface-2)}
.arc{stroke:var(--accent)}
.arc.full{stroke:var(--green)}
.r-num{font:900 60px/1 var(--f-disp);fill:var(--text)}
.r-of{font:600 22px var(--f-mono);fill:var(--dim)}
.wk-side{display:grid;gap:4px;min-width:0}
.wk-side b{font:800 24px/1 var(--f-disp);text-transform:uppercase}
.wk-side span{font-size:13px;color:var(--mute)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{display:grid;justify-items:center;gap:6px;font:600 10px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.day b{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:600 13px/1 var(--f-mono);color:var(--mute);background:var(--surface-2)}
.day.done b{color:var(--accent-ink);background:var(--accent)}
.day.today{color:var(--text)}
.day.today b{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--text)}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini{padding:12px;border-radius:14px;background:var(--surface-2);min-width:0}
.mini .v{font:900 30px/.9 var(--f-disp);white-space:nowrap}
.mini .l{font-size:12px;color:var(--mute);margin-top:6px}
.t-gold,.t-cyan,.t-red,.t-green{color:var(--text)}
.hhint{font-size:13px;line-height:1.4;color:var(--mute);padding:10px 12px;border-radius:12px;background:var(--surface-2)}
.hhint b{color:var(--text);font-weight:600}
.hhint.ok{background:var(--green-soft);color:var(--green)}
.grid12{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
.grid12 .col{display:grid;gap:4px}
.grid12 i{aspect-ratio:1;border-radius:3px;background:var(--surface-2)}
.grid12 i.l1{background:color-mix(in srgb,var(--accent) 35%,var(--surface-2))}
.grid12 i.l2{background:color-mix(in srgb,var(--accent) 70%,var(--surface-2))}
.grid12 i.l3{background:var(--accent)}
.grid12 i.fut{background:transparent;border:1px dashed var(--line)}
.legend{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;font-size:11px;color:var(--dim);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* Plankarten */
.plan{--tone:var(--accent);display:grid;gap:8px;width:100%;text-align:left;padding:16px;border-radius:var(--r);border:1px solid var(--line);cursor:pointer;background:var(--surface);transition:transform .12s}
.plan:active{transform:scale(.985)}
.p-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.plan h3{margin:0;font:900 40px/.85 var(--f-disp);text-transform:uppercase}
.go{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--text)}
.p-ex{color:var(--mute);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-bot{display:flex;justify-content:space-between;align-items:center;gap:10px;font:500 12px/1 var(--f-mono);color:var(--mute)}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 11px/1 var(--f-mono);padding:6px 9px;border-radius:999px;color:var(--mute);background:var(--surface-2)}
.plan.next{border-color:var(--accent)}
.nextchip{display:inline-block;font:600 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}

/* Knöpfe */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:0 18px;border-radius:14px;border:0;background:var(--surface-2);color:var(--text);font:600 15px/1 var(--f-body);cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--mute);border:1px dashed var(--line-2)}
.btn.danger{color:var(--danger);background:var(--danger-soft)}
.btn.sm{width:auto;min-height:38px;padding:0 14px;font-size:14px;border-radius:11px;gap:6px}
.btn.icon{width:38px;min-height:38px;padding:0;border-radius:11px}
.btn.quiet{background:transparent;color:var(--dim)}
.row{display:flex;gap:8px}.row>.btn{flex:1}

/* Laufendes Training */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;margin:6px -16px 0;padding:12px 16px;background:rgba(15,16,18,.9);-webkit-backdrop-filter:saturate(160%) blur(18px);backdrop-filter:saturate(160%) blur(18px);border-bottom:1px solid var(--line)}
.hud-in{display:flex;align-items:center;gap:14px}
.kick{font:600 11px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.clock{font:900 46px/.9 var(--f-disp);margin-top:4px}
.hstats{display:flex;gap:16px;margin-left:auto;text-align:right}
.hstats b{display:block;font:900 26px/.9 var(--f-disp)}
.hstats span{font:500 11px/1 var(--f-mono);color:var(--mute)}
.rest{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px 12px 18px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.rest .l{font:600 11px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.rest .t{font:900 54px/.9 var(--f-disp);margin-top:4px}
.rest .acts{display:flex;gap:6px;margin-left:auto}
.rest .bar{position:absolute;left:0;bottom:0;height:6px;width:100%;background:var(--accent);transition:width .5s linear}
.rest.done{background:var(--green-soft);border-color:transparent}
.rest.done .t,.rest.done .l{color:var(--green)}
.rest.done .bar{width:100%!important;background:var(--green)}
.voice{display:flex;align-items:center;gap:14px;margin:16px 2px 4px}
.mic{flex:none;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;cursor:pointer;border:1px solid var(--line-2);background:var(--surface);color:var(--text);transition:background .2s,box-shadow .2s}
.mic.on{background:var(--accent);color:var(--accent-ink);border-color:transparent;box-shadow:0 0 0 6px var(--accent-soft)}
.voice b{display:block;font-weight:600}
.voice span{color:var(--mute);font-size:13px}

/* Übungskarte */
.ex{display:grid;gap:14px;scroll-margin-top:210px}
.ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ex-idx{font:600 11px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.ex h3{margin:6px 0 0;font:900 min(40px,9.5vw)/.88 var(--f-disp);text-transform:uppercase;text-wrap:balance;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word}
.ex.complete{border-color:color-mix(in srgb,var(--green) 40%,var(--line))}
.summary{display:grid;gap:12px;margin-top:16px;border-color:color-mix(in srgb,var(--green) 40%,var(--line))}
.summary h3{margin:0;font:900 44px/.85 var(--f-disp);text-transform:uppercase}
.summary .hint{color:var(--mute);font-size:14px}
.prs{display:flex;flex-wrap:wrap;gap:6px}
.count{font:600 11px/1 var(--f-mono);color:var(--accent);padding:6px 9px;border-radius:999px;background:var(--accent-soft);white-space:nowrap}
.count.ok{color:var(--green);background:var(--green-soft)}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.fact{display:inline-flex;gap:6px;align-items:baseline;font:500 12px/1 var(--f-mono);padding:8px 10px;border-radius:999px;background:var(--surface-2);color:var(--mute)}
.fact b{color:var(--text);font-weight:600}
.fact.sug{background:var(--accent-soft);color:var(--accent)}
.fact.sug b{color:var(--accent)}
.fact.rec{background:var(--gold-soft);color:var(--gold)}
.fact.rec b{color:var(--gold)}
.setlist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.setrow{display:grid;grid-template-columns:30px 1fr auto auto;align-items:center;gap:10px;padding:8px;border-radius:12px;background:var(--surface-2)}
.setrow .n{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font:600 12px/1 var(--f-mono);background:var(--bg);color:var(--mute)}
.setrow .w{font:900 26px/1 var(--f-disp)}
.setrow .w small{font:500 11px/1 var(--f-mono);color:var(--mute);margin:0 6px 0 3px}
.pr{display:inline-flex;align-items:center;gap:4px;font:600 11px/1 var(--f-mono);padding:5px 9px;border-radius:999px;color:var(--gold);background:var(--gold-soft)}
.sets3{display:grid;gap:8px}
.srow{display:grid;grid-template-columns:32px minmax(0,1.15fr) minmax(0,1fr) 52px;gap:8px;align-items:center}
.srow.head{font:600 10px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:-2px}
.srow.head span{padding-left:4px}
.srow .n{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font:600 13px/1 var(--f-mono);background:var(--surface-2);color:var(--mute)}
.cell{display:flex;align-items:center;gap:6px;height:56px;padding:0 12px;border-radius:14px;border:1px solid var(--line-2);background:var(--bg);cursor:text;transition:border-color .15s;min-width:0}
.cell input,.cell b{flex:1;min-width:0;width:100%;border:0;background:transparent;padding:0;margin:0;font:900 34px/1 var(--f-disp);color:var(--text);text-align:right}
.cell input::placeholder{color:var(--dim)}
.cell input:focus{outline:none}
.cell span{font:500 11px/1 var(--f-mono);color:var(--mute);flex:none}
.cell:focus-within{border-color:var(--accent)}
.chk{width:52px;height:56px;border-radius:14px;display:grid;place-items:center;cursor:pointer;border:1px solid var(--line-2);background:var(--surface-2);color:var(--dim);transition:transform .1s}
.chk:active{transform:scale(.94)}
.chk:disabled{cursor:default;opacity:.5}
.srow.next .n{background:var(--accent-soft);color:var(--accent)}
.srow.next .chk{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
.srow.later .cell input{color:var(--mute)}
.srow.done .n{background:var(--green-soft);color:var(--green)}
.srow.done .n.prn{background:var(--gold);color:#1d1a12}
.srow.done .cell{background:transparent;border-color:var(--line);cursor:default}
.srow.done .chk{background:var(--green);border-color:transparent;color:#07170f}
.setbtns{display:flex;gap:8px}
.setbtns .btn{flex:1}
.addex{display:flex;gap:8px}
.addex input{flex:1}

/* Muskel-Karte */
.bodies{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:center}
.bodies figure{margin:0}
.bodies figcaption{font:600 10px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-top:6px}
.body{width:100%;height:auto;max-height:280px}
.body .m{stroke:var(--surface);stroke-width:1;transition:fill .4s}
.body .base{fill:var(--surface-2)}
.body .l0,.sw.l0{fill:#2a2e34;background:#2a2e34}
.body .l1,.sw.l1{fill:color-mix(in srgb,var(--accent) 35%,var(--surface-2));background:color-mix(in srgb,var(--accent) 35%,var(--surface-2))}
.body .l2,.sw.l2{fill:color-mix(in srgb,var(--accent) 70%,var(--surface-2));background:color-mix(in srgb,var(--accent) 70%,var(--surface-2))}
.body .l3,.sw.l3{fill:var(--accent);background:var(--accent)}
.body .seam{stroke:var(--surface);stroke-width:1.2;fill:none}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}
.mrows{display:grid;gap:8px;margin-top:12px}
.mrow{display:grid;grid-template-columns:10px minmax(0,1fr) minmax(0,1.2fr) 34px;align-items:center;gap:10px;font-size:13px}
.mrow .mn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .mb{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.mrow .mb i{display:block;height:100%;border-radius:3px}
.mrow .mb i.l1{background:color-mix(in srgb,var(--accent) 35%,var(--surface-2))}.mrow .mb i.l2{background:color-mix(in srgb,var(--accent) 70%,var(--surface-2))}.mrow .mb i.l3{background:var(--accent)}
.mrow .mv{font:600 13px/1 var(--f-mono);text-align:right}

/* Erfolge */
.achs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ach{display:grid;gap:4px;align-content:start;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);min-width:0}
.ach-ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--dim);background:var(--surface-2);margin-bottom:6px}
.ach b{font:800 20px/1 var(--f-disp);text-transform:uppercase;color:var(--mute)}
.ach span{font-size:12.5px;line-height:1.35;color:var(--dim)}
.ach small{font:500 11px/1 var(--f-mono);color:var(--dim);margin-top:4px}
.ach-bar{height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.ach-bar i{display:block;height:100%;background:var(--dim);border-radius:2px}
.ach.on{border-color:color-mix(in srgb,var(--gold) 45%,var(--line));background:linear-gradient(180deg,var(--gold-soft),var(--surface) 70%)}
.ach.on .ach-ic{color:#1d1a12;background:var(--gold)}
.ach.on b{color:var(--text)}.ach.on span{color:var(--mute)}.ach.on small{color:var(--gold)}

/* Feier */
.celebrate{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:24px;background:rgba(15,16,18,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);opacity:0;transition:opacity .25s ease;cursor:pointer}
.celebrate.on{opacity:1}
.burst{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cel-card{position:relative;display:grid;justify-items:center;gap:10px;text-align:center;transform:scale(.88);transition:transform .45s cubic-bezier(.2,1.4,.4,1)}
.celebrate.on .cel-card{transform:none}
.cel-icon{width:100px;height:100px;border-radius:50%;display:grid;place-items:center;color:#1d1a12;background:var(--gold);box-shadow:0 0 0 10px var(--gold-soft)}
.celebrate.k-ach .cel-icon{color:var(--accent-ink);background:var(--accent);box-shadow:0 0 0 10px var(--accent-soft)}
.cel-kick{font:600 12px/1 var(--f-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-top:10px}
.celebrate.k-ach .cel-kick{color:var(--accent)}
.cel-title{font:900 64px/.85 var(--f-disp);text-transform:uppercase;max-width:12ch;text-wrap:balance}
.cel-sub{font:600 18px/1.3 var(--f-mono)}
.cel-detail{font:600 12px/1 var(--f-mono);color:var(--green);padding:8px 12px;border-radius:999px;background:var(--green-soft)}
@media (prefers-reduced-motion:no-preference){.celebrate.on .cel-icon{animation:celpulse 1.3s ease-in-out infinite}@keyframes celpulse{50%{transform:scale(1.06)}}}

/* Formulare */
input[type=text]:not(.cell input),input[type=number]:not(.cell input),select,textarea{width:100%;min-height:48px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:12px;color:var(--text);font:500 16px/1.35 var(--f-body);padding:11px 13px;margin:0}
textarea{resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
.editor{display:grid;gap:10px}
.ed-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ed-top span:last-child{font:500 11px/1 var(--f-mono);color:var(--dim)}
.pname{font:900 30px/1 var(--f-disp)!important;text-transform:uppercase}
.setting{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.setting:first-child{border-top:0;padding-top:2px}
.setting:last-child{padding-bottom:2px}
.setting b{display:block;font-weight:600}
.setting span{font-size:13px;color:var(--mute)}
.setting input[type=number]{width:88px;min-width:88px;flex:none;text-align:center;font:600 17px/1 var(--f-mono)}
.switch{appearance:none;-webkit-appearance:none;flex:none;width:51px;height:31px;border-radius:999px;margin:0;cursor:pointer;position:relative;background:var(--line-2);transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:transform .2s}
.switch:checked{background:var(--green)}
.switch:checked::after{transform:translateX(20px)}
.note{margin:0 0 12px;color:var(--mute);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{display:inline-flex;align-items:center;gap:8px;padding:9px 13px;border-radius:999px;border:1px solid var(--line-2);background:transparent;font-size:13px;color:var(--mute);cursor:pointer;transition:transform .1s}
.chips button:active{transform:scale(.96)}
.chips button[aria-pressed=true]{background:var(--text);color:var(--bg);border-color:var(--text)}
.chips button i{width:10px;height:10px;border-radius:50%}

/* Verlauf */
.log{display:grid;grid-template-columns:52px minmax(0,1fr);gap:14px}
.log .d{align-self:start;display:grid;justify-items:center;align-content:start;gap:4px;padding:9px 0;border-radius:12px;background:var(--surface-2)}
.log .d b{font:900 32px/.9 var(--f-disp)}
.log .d span{font:600 10px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.l-top{display:flex;align-items:center;gap:8px}
.l-top h3{margin:0;font:900 30px/.9 var(--f-disp);text-transform:uppercase;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.l-top .btn{margin-left:auto}
.meta{font:500 12px/1.4 var(--f-mono);color:var(--mute);margin-top:6px}
.exlines{list-style:none;margin:10px 0 0;padding:0;display:grid}
.exlines li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.exlines li span:last-child{font:500 12px/1.5 var(--f-mono);color:var(--mute);text-align:right;white-space:nowrap}

/* Fortschritt */
.bento{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bento .wide{grid-column:1/-1}
.kraft b{display:block;font:900 84px/.82 var(--f-disp);margin-top:10px}
.kraft p{margin:6px 0 0;font-size:13px;color:var(--mute)}
.delta{font:600 11px/1 var(--f-mono);padding:5px 8px;border-radius:999px;white-space:nowrap}
.delta.up{color:var(--green);background:var(--green-soft)}
.delta.down{color:var(--danger);background:var(--danger-soft)}
.delta.flat{color:var(--mute);background:var(--surface-2)}
.mile{display:grid;gap:10px}
.track{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.track i{display:block;height:100%;border-radius:5px;background:var(--accent)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{padding:14px}
.tile .l{font:600 10px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.tile .l::before{display:none}
.tile .l>span{color:var(--mute)}
.tile .v{font:900 44px/.85 var(--f-disp);margin-top:12px;white-space:nowrap}
.tile .v small{font:500 13px var(--f-mono);color:var(--mute);margin-left:4px}
.seg{display:grid;grid-template-columns:1fr 1fr;padding:3px;border-radius:11px;background:var(--surface-2)}
.seg button{min-height:34px;border:0;border-radius:9px;background:transparent;color:var(--mute);font:600 12px/1 var(--f-mono);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--line-2);color:var(--text)}
.headline{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:14px 2px 2px}
.headline b{font:900 52px/.85 var(--f-disp)}
.headline small{font:500 13px var(--f-mono);color:var(--mute)}
.chart{width:100%;height:auto;display:block;margin-top:8px}
.chart .grid{stroke:var(--line)}
.chart text{fill:var(--dim);font:500 9px var(--f-mono)}
.chart .line{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .end{fill:var(--accent);stroke:var(--surface);stroke-width:2.5}
.chart .endlbl{fill:var(--text);font:600 11px var(--f-mono)}
.chart .area-a{stop-color:var(--accent);stop-opacity:.28}
.chart .area-b{stop-color:var(--accent);stop-opacity:0}
.chart .bar-a{stop-color:#3a3e45;stop-opacity:1}
.chart .bar-b{stop-color:#2a2e34;stop-opacity:1}
.chart .cur-a,.chart .cur-b{stop-color:var(--accent)}
.chart .vlbl{fill:var(--mute);font:600 9px var(--f-mono)}
.chart .vlbl.cur,.chart .xlbl.cur{fill:var(--accent)}
.prlist{list-style:none;margin:0;padding:0;display:grid}
.prlist li{display:grid;grid-template-columns:36px minmax(0,1fr) auto;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.prlist li:first-child{border-top:0;padding-top:0}
.prlist li:last-child{padding-bottom:0}
.medal{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--gold);background:var(--gold-soft)}
.prlist b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prlist span{font:500 11px/1.4 var(--f-mono);color:var(--mute)}
.prv{font:900 30px/.9 var(--f-disp);text-align:right;white-space:nowrap}
.prv small{font:500 11px var(--f-mono);color:var(--mute);margin-left:4px}
.empty{text-align:center;padding:36px 20px}
.empty .ico{width:56px;height:56px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;color:var(--accent);background:var(--accent-soft)}
.empty b{display:block;font:900 32px/.9 var(--f-disp);text-transform:uppercase}
.empty p{margin:10px auto 0;color:var(--mute);max-width:30ch}

/* Körper */
.prof{display:grid;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{display:grid;gap:6px;min-width:0}
.fld label,.fld .lb{font:600 10px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.fld input{font:600 18px var(--f-mono)!important}
.kcal{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.kring{position:relative;width:116px;height:116px}
.kring svg{width:100%;height:100%;transform:rotate(-90deg)}
.kring div{position:absolute;inset:0;display:grid;place-items:center;align-content:center;text-align:center}
.kring b{font:900 30px/1 var(--f-disp)}
.kring span{font-size:11px;color:var(--mute)}
.macros{display:grid;gap:10px;min-width:0}
.mac{display:grid;gap:5px}
.mac .rowx span{font-size:13px}
.mac .rowx b{font:600 13px var(--f-mono)}
.mac .bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.mac .bar i{display:block;height:100%;border-radius:3px;background:var(--dim)}
.mac.p .bar i{background:var(--accent)}
.why{font-size:13px;color:var(--mute);border-top:1px solid var(--line);padding-top:10px;margin-top:12px}
.why b{color:var(--text);font-weight:600}
.prot-big{display:flex;align-items:baseline;gap:6px}
.prot-big b{font:900 64px/.85 var(--f-disp)}
.prot-big span{font:600 14px var(--f-mono);color:var(--mute)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quick button{display:grid;gap:2px;text-align:left;padding:11px 12px;border-radius:14px;border:0;background:var(--surface-2);cursor:pointer;transition:transform .1s}
.quick button:active{transform:scale(.97)}
.quick b{font:600 13px var(--f-body)}
.quick span{font:600 12px var(--f-mono);color:var(--accent)}
.linkbtn{border:0;background:none;padding:0;font-size:12px;color:var(--mute);text-decoration:underline;cursor:pointer;justify-self:start}
.water{display:grid;grid-template-columns:repeat(auto-fill,minmax(26px,1fr));gap:5px}
.water button{height:34px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);cursor:pointer}
.water button.on{background:color-mix(in srgb,var(--accent) 55%,var(--surface-2));border-color:transparent}
.wlog{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.fine{font-size:11px;color:var(--dim);line-height:1.5;margin:14px 2px 0}

/* Hinweis & Leiste */
#toast{position:fixed;left:16px;right:16px;bottom:calc(96px + env(safe-area-inset-bottom,0px));max-width:528px;margin:0 auto;z-index:20;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;font-weight:600;background:var(--surface-2);border:1px solid var(--line-2);box-shadow:0 18px 40px -16px #000}
#toast::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--accent)}
#toast.gold{border-color:var(--gold)}
#toast.gold::before{background:var(--gold)}
@media (prefers-reduced-motion:no-preference){#toast{animation:tup .2s ease-out}@keyframes tup{from{opacity:0;transform:translateY(8px)}}}
.dock{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:536px;margin:0 auto;z-index:10;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;padding:6px;border-radius:24px;background:rgba(21,23,26,.84);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);border:1px solid var(--line)}
.dock button{display:grid;justify-items:center;gap:4px;padding:8px 0 7px;border:0;border-radius:18px;background:transparent;color:var(--dim);font:600 10.5px/1 var(--f-body);cursor:pointer;min-width:0;transition:color .2s,background .2s}
.dock button[aria-current=page]{color:var(--text);background:var(--surface-2)}
.dock button[aria-current=page] svg{color:var(--accent)}
@media (prefers-reduced-motion:reduce){.hold,.btn,.plan,.chk,.quick button,.chips button{transition:none}}
</style>

<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="n" id="title">Heute</span><span class="k" id="today"></span></div>
    <div class="tr"><span id="live" class="live" hidden>Läuft</span><div id="streakBox" class="streak"></div></div>
  </header>
  <main id="main"></main>
</div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<div id="celebrate" class="celebrate" role="status" aria-live="assertive" hidden></div>
<nav class="dock" aria-label="Navigation">
  <button data-tab="heute"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6.5 6.5v11M3.5 9v6M17.5 6.5v11M20.5 9v6M6.5 12h11"/></svg>Training</button>
  <button data-tab="plaene"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg>Pläne</button>
  <button data-tab="verlauf"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Verlauf</button>
  <button data-tab="fortschritt"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 17l5.5-5.5 4 4 7.5-7.5M15 8h5.5v5.5"/></svg>Fortschritt</button>
  <button data-tab="koerper"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5c-4.4-2.6-8-6-8-10.2A4.6 4.6 0 0 1 12 7.4a4.6 4.6 0 0 1 8 2.9c0 4.2-3.6 7.6-8 10.2z"/></svg>Körper</button>
</nav>
<script>
'use strict';
const LS = 'jarvisGym.v1';
const clone = o => JSON.parse(JSON.stringify(o));
const uid = () => Math.random().toString(36).slice(2, 9);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const num = (v, d = 0) => Number.isFinite(+v) ? +v : d;
const str = (v, d = '') => typeof v === 'string' ? v.slice(0, 80) : d;
const norm = s => s.trim().toLowerCase();

const DEFAULT = {
  plans: [
    { id: 'p1', name: 'Push', exercises: ['Bankdrücken', 'Schulterdrücken', 'Schrägbankdrücken', 'Seitheben', 'Trizepsdrücken'] },
    { id: 'p2', name: 'Pull', exercises: ['Klimmzüge', 'Rudern', 'Latziehen', 'Face Pulls', 'Bizeps-Curls'] },
    { id: 'p3', name: 'Beine', exercises: ['Kniebeugen', 'Beinpresse', 'Rumänisches Kreuzheben', 'Beinbeuger', 'Wadenheben'] }
  ],
  workouts: [],
  active: null,
  ach: {},
  achInit: false,
  settings: { rest: 90, goal: 3, sets: 3, repTarget: 8, step: 2.5, speak: false, accent: 'rot' },
  body: { w: 0, h: 0, a: 0, sex: 'm', goal: 'aufbau', day: '', prot: [], water: 0, weights: [] }
};

function cleanSets(a) {
  return (Array.isArray(a) ? a : []).map(s => ({
    ex: str(s && s.ex), kg: Math.max(0, num(s && s.kg)), reps: Math.round(num(s && s.reps)),
    t: num(s && s.t), pr: s && s.pr ? true : undefined
  })).filter(s => s.ex && s.reps >= 1);
}
function cleanDraft(d) {
  const out = {};
  if (!d || typeof d !== 'object') return out;
  for (const [name, v] of Object.entries(d).slice(0, 60)) {
    if (!v || typeof v !== 'object') continue;
    const rows = {};
    for (const [j, r] of Object.entries(v.rows || {}).slice(0, 20)) {
      if (r && typeof r === 'object' && /^\d+$/.test(j)) rows[j] = { kg: str(r.kg).slice(0, 8), reps: str(r.reps).slice(0, 4) };
    }
    out[str(name)] = { n: clamp(Math.round(num(v.n, 0)), 0, 20), rows };
  }
  return out;
}
function cleanNames(a) { return (Array.isArray(a) ? a : []).map(x => str(x).trim()).filter(Boolean); }

function sanitize(o) {
  o = o && typeof o === 'object' ? o : {};
  const st = clone(DEFAULT);
  if (Array.isArray(o.plans)) {
    st.plans = o.plans.map(p => ({ id: str(p && p.id) || uid(), name: str(p && p.name, 'Plan'), exercises: cleanNames(p && p.exercises) }));
  }
  st.workouts = (Array.isArray(o.workouts) ? o.workouts : []).map(w => ({
    id: str(w && w.id) || uid(), start: num(w && w.start), end: num(w && w.end),
    plan: str(w && w.plan, 'Training'), sets: cleanSets(w && w.sets)
  })).filter(w => w.sets.length && w.start);
  const a = o.active;
  if (a && typeof a === 'object' && num(a.start)) {
    st.active = {
      id: str(a.id) || uid(), start: num(a.start), plan: str(a.plan, 'Training'),
      exercises: cleanNames(a.exercises), sets: cleanSets(a.sets), draft: cleanDraft(a.draft),
      restEnd: num(a.restEnd) || null, restLen: num(a.restLen) || 90000
    };
  }
  if (o.ach && typeof o.ach === 'object') {
    for (const [k, v] of Object.entries(o.ach).slice(0, 100)) if (/^[a-z0-9]{1,20}$/.test(k) && num(v)) st.ach[k] = num(v);
  }
  st.achInit = !!o.achInit;
  const s = o.settings || {};
  st.settings = {
    rest: clamp(num(s.rest, 90), 10, 600), goal: clamp(Math.round(num(s.goal, 3)), 1, 14), sets: clamp(Math.round(num(s.sets, 3)), 1, 10),
    repTarget: clamp(Math.round(num(s.repTarget, 8)), 1, 30), step: clamp(num(s.step, 2.5), 0.25, 25), speak: !!s.speak,
    accent: ['rot', 'kobalt', 'smaragd'].includes(s.accent) ? s.accent : 'rot'
  };
  const bd = o.body && typeof o.body === 'object' ? o.body : {};
  st.body = {
    w: clamp(num(bd.w, 0), 0, 300), h: clamp(num(bd.h, 0), 0, 250), a: clamp(Math.round(num(bd.a, 0)), 0, 110),
    sex: bd.sex === 'w' ? 'w' : 'm', goal: ['aufbau', 'halten', 'definieren'].includes(bd.goal) ? bd.goal : 'aufbau',
    day: typeof bd.day === 'string' ? bd.day.slice(0, 10) : '',
    prot: (Array.isArray(bd.prot) ? bd.prot : []).map(g => clamp(Math.round(num(g, 0)), 0, 200)).filter(g => g > 0).slice(0, 60),
    water: clamp(Math.round(num(bd.water, 0)), 0, 40),
    weights: (Array.isArray(bd.weights) ? bd.weights : []).map(x => ({ d: num(x && x.d), v: Math.round(num(x && x.v) * 10) / 10 })).filter(x => x.d && x.v >= 30 && x.v <= 300).slice(-400)
  };
  return st;
}

let S;
try { S = sanitize(JSON.parse(localStorage.getItem(LS))); } catch { S = sanitize(null); }
let saveT;
function saveSoon() { clearTimeout(saveT); saveT = setTimeout(save, 400); }
function save() {
  try { localStorage.setItem(LS, JSON.stringify(S)); } catch { toast('Speichern fehlgeschlagen – Speicher voll oder gesperrt'); }
}

/* ---------- workout logic ---------- */

  save(); startTicker(); wake(); render(); window.scrollTo(0, 0);

function addSet(ex, kg, reps, viaVoice) {
  const a = S.active;

  reps = Math.round(reps);
  const prev = Math.max(0, ...allSets(ex).map(s => s.kg));
  const pr = prev > 0 && kg > prev;
  a.sets.push({ ex, kg, reps, t: Date.now(), pr: pr || undefined });
  a.restLen = S.settings.rest * 1000;
  a.restEnd = Date.now() + a.restLen;
  save(); render(); vibrate(30);
  advance(a.exercises.indexOf(ex));
  if (pr) celebrate({ kind: 'pr', icon: I.trophy, kicker: 'Neuer Rekord', title: ex, sub: `${fmtKg(kg)} kg × ${reps}`,
    detail: `Vorher ${fmtKg(prev)} kg · +${fmtKg(Math.round((kg - prev) * 100) / 100)} kg` });
  else if (viaVoice) toast(`${ex}: ${fmtKg(kg)} kg × ${reps} gespeichert`);

  const next = cards.slice(idx + 1).find(c => !c.classList.contains('complete')) || cards.find(c => !c.classList.contains('complete'));
  if (next) setTimeout(() => next.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' }), 350);

}

    S.active = null; save(); stopTicker(); releaseWake(); render(); return;
  }
  if (!confirm('Training beenden und speichern?')) return;

/* ---------- timers ---------- */
let tickId = null, beeped = 0;
function startTicker() { if (!tickId) { tick(); tickId = setInterval(tick, 500); } }
function stopTicker() { clearInterval(tickId); tickId = null; }
function tick() {
  const a = S.active;

  const now = Date.now();
  const el = document.getElementById('elapsed');
  if (el) el.textContent = fmtDur(now - a.start);
  const box = document.getElementById('restBox');
  if (box) {
    const left = a.restEnd ? a.restEnd - now : 0;
    box.hidden = !(a.restEnd && (left > 0 || now - a.restEnd < 5000));
    box.classList.toggle('done', left <= 0);
    const t = document.getElementById('restTime');
    if (t) t.textContent = left > 0 ? fmtDur(Math.ceil(left / 1000) * 1000) : 'Los geht’s';
    const bar = document.getElementById('restBar');
    if (bar) bar.style.width = `${clamp(left / (a.restLen || 1), 0, 1) * 100}%`;
  }
  if (a.restEnd && now >= a.restEnd && now - a.restEnd < 3000 && beeped !== a.restEnd) {
    beeped = a.restEnd; beep(); vibrate([200, 100, 200]);
  }

  rec.onresult = e => { lastHeard = e.results[0][0].transcript; handleVoice(lastHeard); };

  rec.onend = () => {
    rec = null;
    const m = document.getElementById('mic');
    if (m) { m.classList.remove('on'); m.setAttribute('aria-pressed', 'false'); }
  };
  const m = document.getElementById('mic');
  if (m) { m.classList.add('on'); m.setAttribute('aria-pressed', 'true'); }

}

  const a = S.active;

  const nums = t.match(/\d+(?:\.\d+)?/g) || [];

  const kg = parseFloat(nums[0]), reps = parseInt(nums[1], 10);

    || a.exercises.find(n => n.toLowerCase().split(/\s+/).some(w => w.length > 3 && t.includes(w)))

/* Bereitschaft: Stunden seit dem letzten Satz, der eine Muskelgruppe direkt trifft. 72 h = voll erholt. */
function readiness() {
  const sets = S.workouts.flatMap(w => w.sets), now = Date.now();
  return GROUPS.map(([name, ks]) => {
    let lastT = 0;
    for (const st of sets) { const m = musclesOf(st.ex); if (m && m.p.some(k => ks.includes(k)) && st.t > lastT) lastT = st.t; }
    const hrs = lastT ? (now - lastT) / 36e5 : Infinity;
    return { name, ks, pct: Math.round(clamp(hrs / 72, 0, 1) * 100), hrs };
  });
}
function planGroups(p) {
  const g = new Set();
  p.exercises.forEach(ex => { const m = musclesOf(ex); if (m) GROUPS.forEach(([n, ks]) => { if (m.p.some(k => ks.includes(k))) g.add(n); }); });
  return g;
}

  else [head, txt] = Math.abs(pct) <= 0.2 ? ['Stabil.', ' Passt zu deinem Ziel.'] : ['Dein Gewicht wandert.', ' Pass die Kalorien leicht an.'];
  return h('div', { class: 'why', style: 'margin-top:0' }, h('b', {}, head), txt, ` Trend: ${perWeek >= 0 ? '+' : '−'}${fmtKg(Math.round(Math.abs(perWeek) * 100) / 100)} kg pro Woche. Die farbige Linie ist der Durchschnitt, damit Wasser-Schwankungen nicht täuschen.`);
}

/* ---------- motivation: muscle map, achievements, celebrations ---------- */
const MUSCLES = { chest: 'Brust', back: 'Rücken', shoulders: 'Schultern', biceps: 'Bizeps', triceps: 'Trizeps', abs: 'Bauch',
  quads: 'Beinvorderseite', hams: 'Beinrückseite', glutes: 'Po', calves: 'Waden', lowback: 'Unterer Rücken' };
const MUSCLE_RULES = [
  [/wade|calf/i, ['calves']],
  [/beinbeuger|leg ?curl|beincurl|nordic/i, ['hams'], ['glutes']],
  [/rumän|rdl|stiff|good ?morning/i, ['hams', 'glutes'], ['lowback']],
  [/kreuzheben|deadlift/i, ['hams', 'glutes', 'lowback'], ['back']],
  [/hip ?thrust|glute|gesäß|abduktor/i, ['glutes'], ['hams']],
  [/kniebeug|squat|beinpresse|leg ?press|ausfallschritt|lunge|bulgar|split|hack|step-?up|beinstrecker|leg ?ext/i, ['quads'], ['glutes']],
  [/bauch|crunch|plank|sit-?up|beinheben|leg ?raise|russian|ab ?roll|hollow/i, ['abs']],
  [/hyperext|rückenstrecker|back ?ext/i, ['lowback'], ['glutes']],
  [/dips/i, ['triceps', 'chest'], ['shoulders']],
  [/trizeps|triceps|french|skull|pushdown|kickback/i, ['triceps']],
  [/bizeps|biceps|curl|hammer/i, ['biceps']],
  [/face ?pull|reverse ?fly|rear ?delt|hintere/i, ['shoulders'], ['back']],
  [/seitheben|lateral|frontheben|front ?raise|arnold|schulter|shoulder|military|overhead|ohp|nackendrücken|upright/i, ['shoulders'], ['triceps']],
  [/klimmz|pull-?up|chin|lat|rudern|row|t-?bar|pullover|shrug/i, ['back'], ['biceps']],
  [/bank|brust|bench|chest|fliegend|butterfly|fly|liegestütz|push-?up|cross/i, ['chest'], ['triceps', 'shoulders']],

function musclesOf(name) {
  for (const [re, p, sec2] of MUSCLE_RULES) if (re.test(name)) return { p, s: sec2 || [] };
  return null;
}
function muscleLoad(days = 7) {
  const since = Date.now() - days * 864e5, load = Object.fromEntries(Object.keys(MUSCLES).map(k => [k, 0])), unknown = new Set();
  const sets = S.workouts.filter(w => w.start >= since).flatMap(w => w.sets).concat(S.active ? S.active.sets : []);
  for (const st of sets) {
    const m = musclesOf(st.ex);
    if (!m) { unknown.add(st.ex); continue; }
    m.p.forEach(k => { load[k] += 1; });
    m.s.forEach(k => { load[k] += .5; });

}
const mLevel = n => n <= 0 ? 'l0' : n < 4 ? 'l1' : n < 10 ? 'l2' : 'l3';
const GROUPS = [['Brust', ['chest']], ['Rücken', ['back']], ['Schultern', ['shoulders']], ['Beine', ['quads', 'hams', 'glutes']], ['Arme', ['biceps', 'triceps']]];

function heroHint() {
  const { load, any } = muscleLoad();
  if (!any) return null;
  const miss = GROUPS.filter(([, ks]) => ks.every(k => load[k] <= 0)).map(([n]) => n);
  return h('div', { class: 'hhint' + (miss.length ? '' : ' ok') },
    miss.length ? ['Zu kurz in den letzten 7 Tagen: ', h('b', {}, miss.join(' · '))] : 'Alle großen Muskelgruppen waren in den letzten 7 Tagen dran.');
}

}

    h('div', { class: 'mrows' }, Object.entries(MUSCLES).map(([k, name]) => {

    unknown.length > 0 && h('p', { class: 'hint', style: 'margin:6px 0 0' }, `Nicht zugeordnet: ${unknown.join(', ')}`))];

const ACH = [
  { id: 'first', icon: I.star, t: 'Erster Schritt', d: 'Dein erstes Training gespeichert', p: s => [s.n, 1] },
  { id: 't10', icon: I.flame, t: 'Zweistellig', d: '10 Trainings gespeichert', p: s => [s.n, 10] },
  { id: 't25', icon: I.flame, t: 'Stammgast', d: '25 Trainings gespeichert', p: s => [s.n, 25] },
  { id: 't100', icon: I.trophy, t: 'Hundert', d: '100 Trainings gespeichert', p: s => [s.n, 100] },
  { id: 'week', icon: I.check, t: 'Wochenziel', d: 'Dein Wochenziel in einer Woche erreicht', p: s => [s.bestWeek, S.settings.goal] },
  { id: 's2', icon: I.bolt, t: 'Am Ball', d: '2 Wochen Serie', p: s => [s.streak, 2] },
  { id: 's4', icon: I.bolt, t: 'Durchzieher', d: '4 Wochen Serie', p: s => [s.streak, 4] },

  { id: 'ton', icon: I.weight, t: 'Eine Tonne', d: '1.000 kg Volumen in einem Training', p: s => [Math.round(s.maxVol), 1000] },
  { id: 'tons5', icon: I.weight, t: 'Schwerlast', d: '5.000 kg Volumen in einem Training', p: s => [Math.round(s.maxVol), 5000] },
  { id: 'total100', icon: I.weight, t: '100 Tonnen', d: '100 Tonnen Volumen insgesamt', p: s => [Math.floor(s.totalVol / 1000), 100] },
  { id: 'legday', icon: I.leg, t: 'Kein Skip Leg Day', d: 'Ein Training mit Beinübungen', p: s => [s.legs ? 1 : 0, 1] },
  { id: 'early', icon: I.sun, t: 'Frühaufsteher', d: 'Ein Training vor 7 Uhr gestartet', p: s => [s.early ? 1 : 0, 1] },
  { id: 'night', icon: I.moon, t: 'Nachteule', d: 'Ein Training nach 21 Uhr gestartet', p: s => [s.night ? 1 : 0, 1] },
  { id: 'all', icon: I.star, t: 'Allrounder', d: 'Alle Pläne in einer Woche trainiert', p: s => [s.allPlans ? 1 : 0, 1] },
];
function achStats() {
  const ws = S.workouts, all = S.active ? [{ start: S.active.start, sets: S.active.sets }, ...ws] : ws;
  const sets = all.flatMap(w => w.sets), perWeek = new Map(), plansByWeek = new Map();
  ws.forEach(w => {
    const k = weekStart(w.start);
    perWeek.set(k, (perWeek.get(k) || 0) + 1);
    if (!plansByWeek.has(k)) plansByWeek.set(k, new Set());
    plansByWeek.get(k).add(w.plan);
  });
  const planNames = S.plans.filter(p => p.exercises.length).map(p => p.name);
  return {
    n: ws.length, streak: streak(), bestWeek: Math.max(0, ...perWeek.values()), prs: sets.filter(x => x.pr).length,
    maxKg: Math.max(0, ...sets.map(x => x.kg)), maxVol: Math.max(0, ...all.map(w => volume(w.sets))), totalVol: volume(sets),
    legs: sets.some(x => { const m = musclesOf(x.ex); return m && m.p.some(k => k === 'quads' || k === 'hams' || k === 'glutes'); }),
    early: ws.some(w => new Date(w.start).getHours() < 7), night: ws.some(w => new Date(w.start).getHours() >= 21),
    allPlans: planNames.length >= 2 && [...plansByWeek.values()].some(set => planNames.every(n => set.has(n))),
  };
}
function checkAchievements(announce = true) {
  const st = achStats(), fresh = [];
  for (const a of ACH) {
    if (S.ach[a.id]) continue;
    const [cur, goal] = a.p(st);
    if (cur >= goal) { S.ach[a.id] = Date.now(); fresh.push(a); }
  }
  if (fresh.length) {
    save();
    if (announce) fresh.forEach(a => celebrate({ kind: 'ach', icon: a.icon, kicker: 'Erfolg freigeschaltet', title: a.t, sub: a.d }));
  }
  return fresh;
}
function achievementsPanel() {
  const st = achStats(), got = ACH.filter(a => S.ach[a.id]).length, nf = new Intl.NumberFormat('de-DE');
  return [sec('Erfolge', `${got} / ${ACH.length}`), h('section', { class: 'panel' }, h('div', { class: 'achs' }, ACH.map(a => {
    const on = !!S.ach[a.id], [cur, goal] = a.p(st);
    return h('div', { class: 'ach' + (on ? ' on' : '') },
      h('div', { class: 'ach-ic' }, icon(on ? a.icon : I.lock, 20)), h('b', {}, a.t), h('span', {}, a.d),
      on ? h('small', {}, `Seit ${new Date(S.ach[a.id]).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: '2-digit' })}`)
        : goal > 1 ? [h('div', { class: 'ach-bar' }, h('i', { style: `width:${Math.round(Math.min(1, cur / goal) * 100)}%` })), h('small', {}, `${nf.format(Math.min(cur, goal))} / ${nf.format(goal)}`)]
          : h('small', {}, 'Noch offen'));
  })))];
}

const celQueue = [];
let celOn = false;
function celebrate(c) { celQueue.push(c); if (!celOn) nextCelebration(); }
function nextCelebration() {
  const c = celQueue.shift(), el = document.getElementById('celebrate');
  if (!c) { celOn = false; return; }
  celOn = true;
  el.className = 'celebrate k-' + c.kind;
  el.replaceChildren(h('canvas', { class: 'burst', 'aria-hidden': 'true' }), h('div', { class: 'cel-card' },
    h('div', { class: 'cel-icon' }, icon(c.icon, 48)), h('div', { class: 'cel-kick' }, c.kicker),
    h('div', { class: 'cel-title' }, c.title), h('div', { class: 'cel-sub' }, c.sub), c.detail && h('div', { class: 'cel-detail' }, c.detail)));
  el.hidden = false;
  requestAnimationFrame(() => el.classList.add('on'));
  fanfare(c.kind);
  vibrate(c.kind === 'pr' ? [60, 40, 60, 40, 180] : [40, 30, 120]);
  burst(el.querySelector('canvas'), c.kind);
  let done = false;
  const close = () => { if (done) return; done = true; el.classList.remove('on'); setTimeout(() => { el.hidden = true; nextCelebration(); }, 280); };
  setTimeout(close, c.kind === 'pr' ? 2800 : 3200);
  el.onclick = close;
}
function fanfare(kind) {
  try {
    if (!ac) return;
    const notes = kind === 'pr' ? [523.25, 659.25, 783.99, 1046.5] : [659.25, 987.77, 1318.5];
    notes.forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + i * .1;
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.18, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + .4);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + .42);
    });
  } catch {}
}
function burst(cv, kind) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1), W = innerWidth, H = innerHeight, ctx = cv.getContext('2d');
  cv.width = W * dpr; cv.height = H * dpr; ctx.scale(dpr, dpr);
  const cols = kind === 'pr' ? ['#d9a441', '#f0d08a', '#b07f22', '#f2f1ee'] : [getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#e0432f', '#f2f1ee', '#4fbf87', '#d9a441'];
  const ps = Array.from({ length: 120 }, () => {
    const a = Math.random() * Math.PI * 2, v = 3 + Math.random() * 8;
    return { x: W / 2, y: H * .4, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 3, r: 1.5 + Math.random() * 3.2, c: cols[Math.random() * cols.length | 0] };
  });
  const t0 = performance.now();
  (function step(now) {
    const k = (now - t0) / 1700;
    ctx.clearRect(0, 0, W, H);
    if (k >= 1 || !cv.isConnected) return;
    ctx.globalAlpha = 1 - k * k;
    for (const q of ps) {
      q.x += q.vx; q.y += q.vy; q.vy += .2; q.vx *= .985;
      ctx.fillStyle = q.c; ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, Math.PI * 2); ctx.fill();
    }
    requestAnimationFrame(step);
  })(t0);
}

/* ---------- app shell ---------- */
const $main = document.getElementById('main');
function render() {
  const views = { heute: viewHeute, plaene: viewPlaene, verlauf: viewVerlauf, fortschritt: viewFortschritt, koerper: viewKoerper };
  document.documentElement.dataset.accent = S.settings.accent;
  $main.replaceChildren(...[].concat(views[tab]()).filter(Boolean));
  document.querySelectorAll('.dock button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === tab ? 'page' : 'false'));
  document.getElementById('live').hidden = !S.active;
  const now = Date.now();
  document.getElementById('title').textContent = S.active && tab === 'heute' ? 'Training' : { heute: 'Heute', plaene: 'Pläne', verlauf: 'Verlauf', fortschritt: 'Fortschritt', koerper: 'Körper' }[tab];
  const stk = streak(), sb = document.getElementById('streakBox');
  sb.hidden = !!S.active || stk < 1;
  sb.replaceChildren(h('b', {}, String(stk)), h('span', {}, stk === 1 ? 'Woche am Stück' : 'Wochen am Stück'));
  document.getElementById('today').textContent = `${new Date(now).toLocaleDateString('de-DE', { weekday: 'long' })} · KW ${isoWeek(now)}`;
  if (S.active) tick();
}
document.querySelectorAll('.dock button').forEach(b => b.addEventListener('click', () => { tab = b.dataset.tab; render(); window.scrollTo(0, 0); }));

if (!S.achInit) { checkAchievements(false); S.achInit = true; save(); }
render();
if (S.active) { startTicker(); wake(); }

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
