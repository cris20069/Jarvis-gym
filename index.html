<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Jarvis Gym">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Jarvis Gym</title>
<style>
/* Layout: ruhige Ein-Spalten-App im Stil einer nativen iOS-App. Große Titel, weiße/graphitfarbene Karten auf neutralem Grund,
   ein Akzent (Kobalt) für Aktionen, Gold nur für Rekorde, Grün nur für "erledigt". Systemschrift, hell und dunkel. */
:root{
  color-scheme:light;
  --bg:#f2f2f5;
  --surface:#ffffff;
  --surface-2:#f7f7f9;
  --sunk:#eeeef2;
  --line:rgba(17,17,24,.07);
  --line-2:rgba(17,17,24,.12);
  --text:#111116;
  --mute:#6c6c75;
  --dim:#a0a0a8;
  --accent:#2c5bff;
  --accent-soft:rgba(44,91,255,.10);
  --on-accent:#ffffff;
  --gold:#b88a1e;
  --gold-soft:rgba(184,138,30,.12);
  --green:#1f9d5c;
  --green-soft:rgba(31,157,92,.11);
  --danger:#d93636;
  --danger-soft:rgba(217,54,54,.09);
  --slate:#5f6b85;
  --shadow:0 1px 2px rgba(17,17,24,.04),0 8px 24px -12px rgba(17,17,24,.12);
  --dock:rgba(255,255,255,.78);
  /* alte Namen, die das Script noch benutzt (Plan-Farben, Diagramme) */
  --red:var(--accent);--red-hi:var(--accent);--red-deep:var(--accent);
  --gold-hi:var(--gold);--cyan:var(--accent);--ink:var(--on-accent);
  --f-display:system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI Variable Display","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --f-body:system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --f-mono:var(--f-body);
  --r:20px;
}
@media (prefers-color-scheme:dark){:root{
  color-scheme:dark;
  --bg:#0b0b0d;--surface:#161619;--surface-2:#1c1c20;--sunk:#101013;
  --line:rgba(255,255,255,.06);--line-2:rgba(255,255,255,.11);
  --text:#f4f4f6;--mute:#9b9ba4;--dim:#63636c;
  --accent:#5b7dff;--accent-soft:rgba(91,125,255,.15);
  --gold:#e0b04a;--gold-soft:rgba(224,176,74,.13);
  --green:#38c983;--green-soft:rgba(56,201,131,.13);
  --danger:#ff6161;--danger-soft:rgba(255,97,97,.12);
  --slate:#8d98b3;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px -18px rgba(0,0,0,.9);
  --dock:rgba(22,22,25,.78);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:400 16px/1.45 var(--f-body);letter-spacing:-.01em;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(112px + env(safe-area-inset-bottom,0px));font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px}

/* Kopf */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:22px 4px;padding-top:calc(22px + env(safe-area-inset-top,0px))}
.brand{display:flex;flex-direction:column-reverse;gap:2px}
.brand .dot{display:none}
.brand .k{font:600 13px/1.2 var(--f-body);color:var(--mute);letter-spacing:0}
.brand .n{font:700 34px/1.05 var(--f-display);letter-spacing:-.025em;color:var(--text)}
.tr{display:flex;align-items:center;gap:10px;padding-bottom:6px}
.date{font:500 13px/1 var(--f-body);color:var(--mute)}
.live{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--f-body);color:var(--green);padding:6px 10px;border-radius:999px;background:var(--green-soft)}
.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green)}

/* Abschnittstitel */
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:30px 4px 10px}
.sec h2{margin:0;font:700 21px/1.2 var(--f-display);letter-spacing:-.02em;color:var(--text)}
.sec span{font:500 14px/1 var(--f-body);color:var(--mute)}

/* Flächen */
.panel{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.stack{display:grid;gap:12px}

/* Heute-dran-Karte */
.upnext{margin-top:14px;display:grid;gap:14px;padding:22px 20px 20px;border-radius:24px;background:var(--accent);color:#fff;box-shadow:0 18px 40px -22px var(--accent)}
.td-kick{font:600 14px/1 var(--f-body);color:rgba(255,255,255,.78)}
.td-name{margin:0;font:700 40px/1 var(--f-display);letter-spacing:-.035em}
.td-list{list-style:none;margin:2px 0 0;padding:0;display:grid}
.td-list li{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0;border-top:1px solid rgba(255,255,255,.18);font-size:16px}
.td-ex{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.td-val{font-weight:600;white-space:nowrap}
.td-val.new{font-weight:500;color:rgba(255,255,255,.7)}
.td-meta{font:500 13px/1.4 var(--f-body);color:rgba(255,255,255,.75)}
.upnext .btn.td-go{background:#fff;color:var(--accent);min-height:54px;font-size:17px}

/* Wochenkarte */
.weekcard{display:grid;gap:18px}
.wk-top{display:flex;align-items:center;gap:18px}
.weekcard .reactor svg{width:112px}
.wk-side{display:grid;gap:4px;min-width:0}
.wk-side b{font:700 20px/1.2 var(--f-display);letter-spacing:-.02em}
.wk-side span{font-size:14px;color:var(--mute)}

/* Wochenring */
.hero{display:grid;gap:20px;padding:22px 18px 18px;overflow:hidden;margin-top:14px}
.reactor{display:grid;place-items:center}
.reactor svg{width:min(56vw,200px);height:auto;overflow:visible}
.tick{display:none}
.arc-track{stroke:var(--sunk)}
.arc{stroke:var(--accent)}
.arc.full{stroke:var(--green)}
.core{fill:none;stroke:none}
.inner{display:none}
.r-num{font:700 58px/1 var(--f-display);letter-spacing:-.03em;fill:var(--text)}
.r-of{font-size:24px;font-weight:500;fill:var(--dim)}
.r-lbl{display:none}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{display:grid;justify-items:center;gap:7px;font:600 11px/1 var(--f-body);color:var(--dim)}
.day b{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:600 15px/1 var(--f-body);color:var(--mute);background:var(--sunk)}
.day.done b{color:var(--on-accent);background:var(--accent)}
.day.today{color:var(--text)}
.day.today b{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--text)}

.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini{padding:12px;border-radius:14px;background:var(--surface-2);min-width:0}
.mini .v{font:700 24px/1 var(--f-display);letter-spacing:-.02em;white-space:nowrap;color:var(--text)}
.mini .l{font:500 12px/1.25 var(--f-body);color:var(--mute);margin-top:6px}
.t-gold,.t-cyan,.t-red,.t-green{color:var(--text)}

/* Plankarten */
.plan{--tone:var(--accent);position:relative;display:grid;gap:10px;width:100%;text-align:left;padding:18px;border-radius:var(--r);border:1px solid var(--line);cursor:pointer;background:var(--surface);box-shadow:var(--shadow);transition:transform .12s}
.plan:active{transform:scale(.985)}
.p-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.plan h3{margin:0;font:700 24px/1.1 var(--f-display);letter-spacing:-.02em}
.go{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--tone);color:#fff}
.p-ex{color:var(--mute);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-bot{display:flex;justify-content:space-between;align-items:center;gap:10px;font:500 13px/1 var(--f-body);color:var(--mute)}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--f-body);padding:6px 10px;border-radius:999px;color:var(--text);background:var(--sunk)}
.plan.next{border-color:var(--tone);box-shadow:0 0 0 1px var(--tone),var(--shadow)}
.nextchip{display:inline-block;white-space:nowrap;font:600 12px/1 var(--f-body);color:var(--tone);margin-bottom:6px}

/* Knöpfe */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:0 18px;border-radius:14px;border:0;background:var(--sunk);color:var(--text);font:600 16px/1 var(--f-body);letter-spacing:-.01em;cursor:pointer;transition:transform .1s,opacity .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;color:var(--accent);border:1px dashed var(--line-2)}
.btn.danger{color:var(--danger);background:var(--danger-soft)}
.btn.sm{width:auto;min-height:38px;padding:0 14px;font-size:14px;border-radius:11px;gap:6px}
.btn.icon{width:38px;min-height:38px;padding:0;border-radius:11px}
.btn.quiet{background:transparent;color:var(--mute)}
.row{display:flex;gap:8px}.row>.btn{flex:1}

/* Laufendes Training */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;margin:6px -16px 0;padding:12px 16px;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.hud-in{display:flex;align-items:center;gap:14px}
.kick{font:600 13px/1 var(--f-body);color:var(--mute)}
.clock{font:700 38px/1 var(--f-display);letter-spacing:-.03em;color:var(--text);margin-top:4px}
.hstats{display:flex;gap:16px;margin-left:auto;text-align:right}
.hstats b{display:block;font:700 20px/1 var(--f-display);letter-spacing:-.02em}
.hstats span{font:500 12px/1 var(--f-body);color:var(--mute)}
.rest{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px 12px 14px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.rest .l{font:600 12px/1 var(--f-body);color:var(--mute)}
.rest .t{font:700 32px/1 var(--f-display);letter-spacing:-.03em;color:var(--accent);margin-top:4px}
.rest .acts{display:flex;gap:6px;margin-left:auto}
.rest .bar{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--accent);transition:width .5s linear}
.rest.done{background:var(--green-soft);border-color:transparent}
.rest.done .t,.rest.done .l{color:var(--green)}
.rest.done .bar{width:100%!important;background:var(--green)}

.voice{display:flex;align-items:center;gap:14px;margin:16px 4px 4px}
.mic{flex:none;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;cursor:pointer;border:0;background:var(--surface);color:var(--text);box-shadow:var(--shadow);transition:background .2s,box-shadow .2s}
.mic.on{background:var(--danger);color:#fff;box-shadow:0 0 0 6px var(--danger-soft)}
.voice b{display:block;font-weight:600}
.voice span{color:var(--mute);font-size:14px}

/* Übungskarte */
.ex{display:grid;gap:14px;scroll-margin-top:210px}
.ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ex-idx{font:600 12px/1 var(--f-body);color:var(--dim)}
.ex h3{margin:4px 0 0;font:700 22px/1.15 var(--f-display);letter-spacing:-.02em;text-wrap:balance}
.summary{display:grid;gap:12px;border-color:transparent;background:var(--green-soft);box-shadow:none}
.summary h3{margin:0;font:700 26px/1.1 var(--f-display);letter-spacing:-.02em}
.summary .hint{color:var(--mute);font-size:15px}
.prs{display:flex;flex-wrap:wrap;gap:6px}
.hhint{font:500 14px/1.4 var(--f-body);color:var(--mute);text-align:center;padding:10px 12px;border-radius:12px;background:var(--surface-2)}
.hhint b{color:var(--text);font-weight:600}
.hhint.ok{background:var(--green-soft);color:var(--green)}
.bodies{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:center}
.bodies figure{margin:0}
.bodies figcaption{font:600 12px/1 var(--f-body);color:var(--mute);margin-top:6px}
.body{width:100%;height:auto;max-height:280px}
.body .m{stroke:var(--surface);stroke-width:1;transition:fill .4s}
.body .base{fill:var(--sunk)}
.body .l0,.sw.l0{fill:var(--line-2);background:var(--line-2)}
.body .l1,.sw.l1{fill:color-mix(in srgb,var(--accent) 35%,var(--sunk));background:color-mix(in srgb,var(--accent) 35%,var(--sunk))}
.body .l2,.sw.l2{fill:color-mix(in srgb,var(--accent) 70%,var(--sunk));background:color-mix(in srgb,var(--accent) 70%,var(--sunk))}
.body .l3,.sw.l3{fill:var(--accent);background:var(--accent)}
.body .seam{stroke:var(--surface);stroke-width:1.2;fill:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;margin:12px 0 4px;font:500 12px/1 var(--f-body);color:var(--mute)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}
.mrows{display:grid;gap:8px;margin-top:12px}
.mrow{display:grid;grid-template-columns:10px minmax(0,1fr) minmax(0,1.2fr) 34px;align-items:center;gap:10px;font-size:14px}
.mrow .mn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .mb{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.mrow .mb i{display:block;height:100%;border-radius:3px}
.mrow .mb i.l1{background:color-mix(in srgb,var(--accent) 35%,var(--sunk))}.mrow .mb i.l2{background:color-mix(in srgb,var(--accent) 70%,var(--sunk))}.mrow .mb i.l3{background:var(--accent)}
.mrow .mv{font:600 15px/1 var(--f-body);text-align:right}

/* Erfolge */
.achs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ach{display:grid;gap:4px;align-content:start;padding:14px;border-radius:16px;background:var(--surface-2);min-width:0}
.ach-ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--dim);background:var(--sunk);margin-bottom:6px}
.ach b{font:600 15px/1.2 var(--f-body);color:var(--mute)}
.ach span{font-size:13px;line-height:1.35;color:var(--dim)}
.ach small{font:500 12px/1 var(--f-body);color:var(--dim);margin-top:4px}
.ach-bar{height:4px;border-radius:2px;background:var(--sunk);overflow:hidden;margin-top:6px}
.ach-bar i{display:block;height:100%;background:var(--dim);border-radius:2px}
.ach.on{background:var(--gold-soft)}
.ach.on .ach-ic{color:#fff;background:var(--gold)}
.ach.on b{color:var(--text)}.ach.on span{color:var(--mute)}.ach.on small{color:var(--gold)}

/* Feier-Overlay */
.celebrate{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:24px;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);opacity:0;transition:opacity .25s ease;cursor:pointer}
.celebrate.on{opacity:1}
.burst{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cel-card{position:relative;display:grid;justify-items:center;gap:10px;text-align:center;transform:scale(.9);transition:transform .45s cubic-bezier(.2,1.3,.4,1)}
.celebrate.on .cel-card{transform:none}
.cel-icon{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--gold);box-shadow:0 0 0 10px var(--gold-soft)}
.celebrate.k-ach .cel-icon{background:var(--accent);box-shadow:0 0 0 10px var(--accent-soft)}
.cel-kick{font:600 14px/1 var(--f-body);color:var(--gold);margin-top:10px}
.celebrate.k-ach .cel-kick{color:var(--accent)}
.cel-title{font:700 38px/1.05 var(--f-display);letter-spacing:-.03em;max-width:14ch;text-wrap:balance}
.cel-sub{font:500 17px/1.35 var(--f-body);color:var(--mute)}
.cel-detail{font:600 14px/1 var(--f-body);color:var(--green);padding:8px 12px;border-radius:999px;background:var(--green-soft)}
@media (prefers-reduced-motion:no-preference){.celebrate.on .cel-icon{animation:celpulse 1.4s ease-in-out infinite}@keyframes celpulse{50%{transform:scale(1.05)}}}

.count{font:600 12px/1 var(--f-body);color:var(--accent);padding:6px 10px;border-radius:999px;background:var(--accent-soft);white-space:nowrap}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.fact{display:inline-flex;gap:6px;align-items:baseline;font:500 13px/1 var(--f-body);padding:8px 11px;border-radius:10px;background:var(--surface-2);color:var(--mute)}
.fact b{color:var(--text);font-weight:600}
.fact.sug{background:var(--accent-soft);color:var(--accent)}
.fact.sug b{color:var(--accent)}
.fact.rec b{color:var(--gold)}
.setlist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.setrow{display:grid;grid-template-columns:30px 1fr auto auto;align-items:center;gap:10px;padding:8px;border-radius:12px;background:var(--surface-2)}
.setrow .n{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font:600 13px/1 var(--f-body);background:var(--sunk);color:var(--mute)}
.setrow .w{font:700 20px/1 var(--f-display);letter-spacing:-.02em}
.setrow .w small{font:500 12px/1 var(--f-body);color:var(--mute);margin:0 6px 0 3px}
.pr{display:inline-flex;align-items:center;gap:4px;font:600 12px/1 var(--f-body);padding:5px 9px;border-radius:999px;color:var(--gold);background:var(--gold-soft)}

/* Satzzeilen */
.sets3{display:grid;gap:8px}
.srow{display:grid;grid-template-columns:32px minmax(0,1.15fr) minmax(0,1fr) 52px;gap:8px;align-items:center}
.srow.head{font:600 12px/1 var(--f-body);color:var(--dim);margin-bottom:-2px}
.srow.head span{padding-left:4px}
.srow .n{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font:600 14px/1 var(--f-body);background:var(--sunk);color:var(--mute)}
.cell{display:flex;align-items:center;gap:6px;height:52px;padding:0 14px;border-radius:13px;border:1px solid transparent;background:var(--surface-2);cursor:text;transition:border-color .15s,background .15s;min-width:0}
.cell input,.cell b{flex:1;min-width:0;width:100%;border:0;background:transparent;padding:0;margin:0;font:700 22px/1 var(--f-display);letter-spacing:-.02em;color:var(--text);text-align:right}
.cell input::placeholder{color:var(--dim)}
.cell input:focus{outline:none}
.cell span{font:500 13px/1 var(--f-body);color:var(--mute);flex:none}
.cell:focus-within{border-color:var(--accent);background:var(--surface)}
.chk{width:52px;height:52px;border-radius:13px;display:grid;place-items:center;cursor:pointer;border:0;background:var(--sunk);color:var(--dim);transition:transform .1s,background .15s}
.chk:active{transform:scale(.94)}
.chk:disabled{cursor:default;opacity:.5}
.srow.next .n{background:var(--accent-soft);color:var(--accent)}
.srow.next .chk{background:var(--accent);color:var(--on-accent)}
.srow.later .cell input{color:var(--mute)}
.srow.done .n{background:var(--green-soft);color:var(--green)}
.srow.done .n.prn{background:var(--gold);color:#fff}
.srow.done .cell{background:transparent;border-color:var(--line);cursor:default}
.srow.done .chk{background:var(--green);color:#fff}
.setbtns{display:flex;gap:8px}
.setbtns .btn{flex:1}
.count.ok{color:var(--green);background:var(--green-soft)}
.addex{display:flex;gap:8px}
.addex input{flex:1}

/* Formulare */
input[type=text]:not(.cell input),.setting input[type=number],select,textarea{width:100%;min-height:50px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;color:var(--text);font:400 17px/1.35 var(--f-body);padding:11px 14px;margin:0}
textarea{resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.editor{--tone:var(--accent);display:grid;gap:10px}
.ed-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ed-top span:last-child{font:500 13px/1 var(--f-body);color:var(--dim)}
.pname{font:700 22px/1 var(--f-display)!important;letter-spacing:-.02em}
.setting{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.setting:first-child{border-top:0;padding-top:2px}
.setting:last-child{padding-bottom:2px}
.setting b{display:block;font-weight:600}
.setting span{font-size:14px;color:var(--mute)}
.setting input[type=number]{width:88px;min-width:88px;flex:none;text-align:center;font:600 18px/1 var(--f-body)}
.switch{appearance:none;-webkit-appearance:none;flex:none;width:51px;height:31px;border-radius:999px;margin:0;cursor:pointer;position:relative;background:var(--line-2);transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.switch:checked{background:var(--green)}
.switch:checked::after{transform:translateX(20px)}
.note{margin:0 0 12px;color:var(--mute);font-size:15px}

/* Verlauf */
.log{display:grid;grid-template-columns:52px minmax(0,1fr);gap:14px}
.log .d{align-self:start;display:grid;justify-items:center;align-content:start;gap:4px;padding:9px 0;border-radius:12px;background:var(--surface-2)}
.log .d b{font:700 26px/1 var(--f-display);letter-spacing:-.02em}
.log .d span{font:600 11px/1 var(--f-body);color:var(--mute)}
.l-top{display:flex;align-items:center;gap:8px}
.l-top h3{margin:0;font:700 19px/1.2 var(--f-display);letter-spacing:-.02em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.l-top .btn{margin-left:auto}
.meta{font:500 13px/1.4 var(--f-body);color:var(--mute);margin-top:4px}
.exlines{list-style:none;margin:10px 0 0;padding:0;display:grid}
.exlines li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.exlines li span:last-child{font:500 14px/1.5 var(--f-body);color:var(--mute);text-align:right;white-space:nowrap}

/* Fortschritt */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{padding:16px}
.tile .l{display:flex;align-items:center;gap:7px;font:500 13px/1 var(--f-body);color:var(--mute)}
.tile .l::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.tile .l>span{color:var(--mute)}
.tile .l.t-red,.tile .l.t-cyan{color:var(--accent)}.tile .l.t-gold{color:var(--gold)}.tile .l.t-green{color:var(--green)}
.tile .v{font:700 32px/1 var(--f-display);letter-spacing:-.03em;margin-top:12px;white-space:nowrap}
.tile .v small{font-size:16px;font-weight:500;color:var(--mute);margin-left:3px;letter-spacing:0}
.seg{display:grid;grid-template-columns:1fr 1fr;padding:3px;border-radius:11px;background:var(--sunk)}
.seg button{min-height:34px;border:0;border-radius:9px;background:transparent;color:var(--mute);font:600 14px/1 var(--f-body);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.headline{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:16px 4px 2px}
.headline b{font:700 36px/1 var(--f-display);letter-spacing:-.03em;color:var(--text)}
.headline small{font:500 15px var(--f-body);color:var(--mute)}
.delta{font:600 12px/1 var(--f-body);padding:5px 9px;border-radius:999px}
.delta.up{color:var(--green);background:var(--green-soft)}
.delta.down{color:var(--danger);background:var(--danger-soft)}
.delta.flat{color:var(--mute);background:var(--sunk)}
.chart{width:100%;height:auto;display:block;margin-top:6px}
.chart .grid{stroke:var(--line)}
.chart text{fill:var(--dim);font:500 9px var(--f-body)}
.chart .line{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .end{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .endlbl{fill:var(--text);font:700 12px var(--f-body)}
.chart .area-a{stop-color:var(--accent);stop-opacity:.18}
.chart .area-b{stop-color:var(--accent);stop-opacity:0}
.chart .bar-a{stop-color:var(--slate);stop-opacity:.45}
.chart .bar-b{stop-color:var(--slate);stop-opacity:.18}
.chart .cur-a{stop-color:var(--accent)}
.chart .cur-b{stop-color:var(--accent)}
.chart .vlbl{fill:var(--mute);font:600 9px var(--f-body)}
.chart .vlbl.cur,.chart .xlbl.cur{fill:var(--accent)}
.prlist{list-style:none;margin:0;padding:0;display:grid}
.prlist li{display:grid;grid-template-columns:36px minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.prlist li:first-child{border-top:0;padding-top:0}
.prlist li:last-child{padding-bottom:0}
.medal{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--gold);background:var(--gold-soft)}
.prlist b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prlist span{font:500 13px/1.4 var(--f-body);color:var(--mute)}
.prv{font:700 22px/1 var(--f-display);letter-spacing:-.02em;text-align:right;white-space:nowrap}
.prv small{font:500 13px var(--f-body);color:var(--mute);margin-left:4px;letter-spacing:0}
.empty{text-align:center;padding:36px 20px}
.empty .ico{width:56px;height:56px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;color:var(--accent);background:var(--accent-soft)}
.empty b{display:block;font:700 20px/1.2 var(--f-display);letter-spacing:-.02em}
.empty p{margin:8px auto 0;color:var(--mute);max-width:30ch}

/* Hinweis + Leiste unten */
#toast{position:fixed;left:16px;right:16px;bottom:calc(96px + env(safe-area-inset-bottom,0px));max-width:528px;margin:0 auto;z-index:20;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;font-weight:600;color:var(--text);background:var(--surface);border:1px solid var(--line);box-shadow:0 18px 40px -16px rgba(0,0,0,.35)}
#toast::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--accent)}
#toast.gold::before{background:var(--gold)}
@media (prefers-reduced-motion:no-preference){#toast{animation:rise .2s ease-out}@keyframes rise{from{opacity:0;transform:translateY(8px)}}}
.dock{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:536px;margin:0 auto;z-index:10;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px;padding:6px;border-radius:26px;background:var(--dock);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border:1px solid var(--line);box-shadow:0 14px 36px -18px rgba(0,0,0,.45)}
.dock button{display:grid;justify-items:center;gap:4px;padding:8px 0 7px;border:0;border-radius:20px;background:transparent;color:var(--dim);font:600 11px/1 var(--f-body);cursor:pointer;min-width:0}
.dock button[aria-current=page]{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="n" id="title">Heute</span><span class="k" id="today"></span></div>
    <div class="tr"><span id="live" class="live" hidden>Läuft</span></div>
  </header>
  <main id="main"></main>
</div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<div id="celebrate" class="celebrate" role="status" aria-live="assertive" hidden></div>
<nav class="dock" aria-label="Navigation">
  <button data-tab="heute"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6.5 6.5v11M3.5 9v6M17.5 6.5v11M20.5 9v6M6.5 12h11"/></svg>Training</button>
  <button data-tab="plaene"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg>Pläne</button>
  <button data-tab="verlauf"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Verlauf</button>
  <button data-tab="fortschritt"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 17l5.5-5.5 4 4 7.5-7.5M15 8h5.5v5.5"/></svg>Fortschritt</button>
</nav>
<script>
'use strict';
const LS = 'jarvisGym.v1';
const clone = o => JSON.parse(JSON.stringify(o));
const uid = () => Math.random().toString(36).slice(2, 9);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const num = (v, d = 0) => Number.isFinite(+v) ? +v : d;
const str = (v, d = '') => typeof v === 'string' ? v.slice(0, 80) : d;
const norm = s => s.trim().toLowerCase();

const DEFAULT = {
  plans: [
    { id: 'p1', name: 'Push', exercises: ['Bankdrücken', 'Schulterdrücken', 'Schrägbankdrücken', 'Seitheben', 'Trizepsdrücken'] },
    { id: 'p2', name: 'Pull', exercises: ['Klimmzüge', 'Rudern', 'Latziehen', 'Face Pulls', 'Bizeps-Curls'] },
    { id: 'p3', name: 'Beine', exercises: ['Kniebeugen', 'Beinpresse', 'Rumänisches Kreuzheben', 'Beinbeuger', 'Wadenheben'] }
  ],
  workouts: [],
  active: null,
  ach: {},
  achInit: false,
  settings: { rest: 90, goal: 3, sets: 3, repTarget: 8, step: 2.5, speak: false }
};

function cleanSets(a) {
  return (Array.isArray(a) ? a : []).map(s => ({
    ex: str(s && s.ex), kg: Math.max(0, num(s && s.kg)), reps: Math.round(num(s && s.reps)),
    t: num(s && s.t), pr: s && s.pr ? true : undefined
  })).filter(s => s.ex && s.reps >= 1);
}
function cleanDraft(d) {
  const out = {};
  if (!d || typeof d !== 'object') return out;
  for (const [name, v] of Object.entries(d).slice(0, 60)) {
    if (!v || typeof v !== 'object') continue;
    const rows = {};
    for (const [j, r] of Object.entries(v.rows || {}).slice(0, 20)) {
      if (r && typeof r === 'object' && /^\d+$/.test(j)) rows[j] = { kg: str(r.kg).slice(0, 8), reps: str(r.reps).slice(0, 4) };
    }
    out[str(name)] = { n: clamp(Math.round(num(v.n, 0)), 0, 20), rows };
  }
  return out;
}
function cleanNames(a) { return (Array.isArray(a) ? a : []).map(x => str(x).trim()).filter(Boolean); }

function sanitize(o) {
  o = o && typeof o === 'object' ? o : {};
  const st = clone(DEFAULT);
  if (Array.isArray(o.plans)) {
    st.plans = o.plans.map(p => ({ id: str(p && p.id) || uid(), name: str(p && p.name, 'Plan'), exercises: cleanNames(p && p.exercises) }));
  }
  st.workouts = (Array.isArray(o.workouts) ? o.workouts : []).map(w => ({
    id: str(w && w.id) || uid(), start: num(w && w.start), end: num(w && w.end),
    plan: str(w && w.plan, 'Training'), sets: cleanSets(w && w.sets)
  })).filter(w => w.sets.length && w.start);
  const a = o.active;
  if (a && typeof a === 'object' && num(a.start)) {
    st.active = {
      id: str(a.id) || uid(), start: num(a.start), plan: str(a.plan, 'Training'),
      exercises: cleanNames(a.exercises), sets: cleanSets(a.sets), draft: cleanDraft(a.draft),
      restEnd: num(a.restEnd) || null, restLen: num(a.restLen) || 90000
    };
  }
  if (o.ach && typeof o.ach === 'object') {
    for (const [k, v] of Object.entries(o.ach).slice(0, 100)) if (/^[a-z0-9]{1,20}$/.test(k) && num(v)) st.ach[k] = num(v);
  }
  st.achInit = !!o.achInit;
  const s = o.settings || {};
  st.settings = {
    rest: clamp(num(s.rest, 90), 10, 600), goal: clamp(Math.round(num(s.goal, 3)), 1, 14), sets: clamp(Math.round(num(s.sets, 3)), 1, 10),
    repTarget: clamp(Math.round(num(s.repTarget, 8)), 1, 30), step: clamp(num(s.step, 2.5), 0.25, 25), speak: !!s.speak
  };
  return st;
}

let S;
try { S = sanitize(JSON.parse(localStorage.getItem(LS))); } catch { S = sanitize(null); }
let saveT;
function saveSoon() { clearTimeout(saveT); saveT = setTimeout(save, 400); }
function save() {
  try { localStorage.setItem(LS, JSON.stringify(S)); } catch { toast('Speichern fehlgeschlagen – Speicher voll oder gesperrt'); }
}

/* ---------- DOM helpers ---------- */
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const k in props || {}) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'value') e.value = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) {
    if (c == null || c === false) continue;
    e.append(c.nodeType ? c : document.createTextNode(c));
  }
  return e;
}
function sv(tag, attrs, ...kids) {
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in attrs || {}) e.setAttribute(k, attrs[k]);
  for (const c of kids) if (c != null) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
const I = {
  arrow: 'M5 12h14M13 6l6 6-6 6',
  plus: 'M12 5v14M5 12h14',
  minus: 'M5 12h14',
  check: 'M5 12.5l4.5 4.5L19 7.5',
  x: 'M6.5 6.5l11 11M17.5 6.5l-11 11',
  mic: 'M12 3.5a3 3 0 0 0-3 3v5.5a3 3 0 0 0 6 0V6.5a3 3 0 0 0-3-3zM5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v2.5',
  trophy: 'M8 4h8v5.5a4 4 0 0 1-8 0V4zM8 6H5.5a2.5 2.5 0 0 0 2.6 4M16 6h2.5a2.5 2.5 0 0 1-2.6 4M12 13.5V17M8.5 20h7',
  chart: 'M3.5 17l5.5-5.5 4 4 7.5-7.5M15 8h5.5v5.5',
  clock: 'M12 3.5a8.5 8.5 0 1 0 0 17 8.5 8.5 0 0 0 0-17zM12 7.5V12l3 2',
  star: 'M12 3.5l2.6 5.3 5.8.9-4.2 4.1 1 5.8-5.2-2.8-5.2 2.8 1-5.8-4.2-4.1 5.8-.9z',
  flame: 'M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2.2 1.2-3.6 2.4-4.6.3 1.9 1.3 2.9 2.6 3.1C11.5 8.8 12.4 6 12 3z',
  bolt: 'M13 3L5 13.5h6L10 21l8-10.5h-6L13 3z',
  weight: 'M6.5 6.5v11M3.5 9v6M17.5 6.5v11M20.5 9v6M6.5 12h11',
  sun: 'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4',
  moon: 'M19 14.5A7.5 7.5 0 0 1 9.5 5a7.5 7.5 0 1 0 9.5 9.5z',
  leg: 'M10 3v7.5L8 20h3.5l1.5-6 1.5 6H18l-2-9.5V3',
  lock: 'M7 11V8a5 5 0 0 1 10 0v3M5.5 11h13v9.5h-13z'
};
const icon = (d, s = 20) => sv('svg', { width: s, height: s, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', 'stroke-width': 2.2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'aria-hidden': 'true' }, sv('path', { d }));

let toastT;
function toast(msg, kind) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = kind || ''; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2800);
}

/* ---------- formatting & stats ---------- */
const fmtKg = n => String(Math.round(n * 100) / 100).replace('.', ',');
const parseNum = v => parseFloat(String(v).replace(',', '.'));
const setLabel = s => s.kg > 0 ? `${fmtKg(s.kg)}×${s.reps}` : `${s.reps} Wdh.`;
const setsLabel = ss => {
  if (ss.every(s => s.kg === ss[0].kg)) return ss[0].kg > 0 ? `${fmtKg(ss[0].kg)} kg · ${ss.map(s => s.reps).join('/')}` : `${ss.map(s => s.reps).join('/')} Wdh.`;
  return ss.map(setLabel).join(' · ');
};
const fmtTons = kg => kg < 1000 ? `${Math.round(kg)} kg` : `${fmtKg(Math.round(kg / 100) / 10)} t`;
function fmtDur(ms) {
  const s = Math.max(0, Math.floor(ms / 1000)), hh = Math.floor(s / 3600), mm = Math.floor(s % 3600 / 60), ss = s % 60;
  return hh ? `${hh}:${String(mm).padStart(2, '0')}:${String(ss).padStart(2, '0')}` : `${mm}:${String(ss).padStart(2, '0')}`;
}
const fmtShort = ts => new Date(ts).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' });
const e1rm = (kg, reps) => kg * (1 + reps / 30);
const volume = sets => sets.reduce((a, s) => a + s.kg * s.reps, 0);
const midnight = ts => { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); };
function daysAgo(ts) {
  const n = Math.round((midnight(Date.now()) - midnight(ts)) / 864e5);
  return n <= 0 ? 'heute' : n === 1 ? 'gestern' : `vor ${n} Tagen`;
}
function isoWeek(ts) {
  const d = new Date(midnight(ts));
  d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7);
  const w1 = new Date(d.getFullYear(), 0, 4);
  return 1 + Math.round(((d - w1) / 864e5 - 3 + (w1.getDay() + 6) % 7) / 7);
}
function weekStart(ts) {
  const d = new Date(midnight(ts));
  d.setDate(d.getDate() - (d.getDay() + 6) % 7);
  return d.getTime();
}
const thisWeek = () => S.workouts.filter(w => weekStart(w.start) === weekStart(Date.now()));
const weekCount = () => thisWeek().length;
function streak() {
  const counts = new Map();
  S.workouts.forEach(w => { const k = weekStart(w.start); counts.set(k, (counts.get(k) || 0) + 1); });
  const d = new Date(weekStart(Date.now()));
  let n = 0;
  if ((counts.get(d.getTime()) || 0) < S.settings.goal) d.setDate(d.getDate() - 7);
  while ((counts.get(d.getTime()) || 0) >= S.settings.goal) { n++; d.setDate(d.getDate() - 7); }
  return n;
}
function weekDays() {
  const start = new Date(weekStart(Date.now())), today = midnight(Date.now());
  const trained = new Set(S.workouts.map(w => midnight(w.start)));
  return ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'].map((short, i) => {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const t = d.getTime();
    return { short, num: d.getDate(), long: d.toLocaleDateString('de-DE', { weekday: 'long' }), done: trained.has(t), today: t === today };
  });
}
function allSets(ex) {
  const k = norm(ex);
  const cur = S.active ? S.active.sets : [];
  return S.workouts.flatMap(w => w.sets).concat(cur).filter(s => norm(s.ex) === k);
}
function lastSets(ex) {
  const k = norm(ex);
  for (const w of S.workouts) {
    const m = w.sets.filter(s => norm(s.ex) === k);
    if (m.length) return m;
  }
  return [];
}
function suggest(ex) {
  const l = lastSets(ex);
  if (!l.length) return null;
  const top = Math.max(...l.map(s => s.kg));
  const atTop = l.filter(s => s.kg === top);
  const { repTarget, step } = S.settings;
  const best = Math.max(...atTop.map(s => s.reps));
  if (top > 0 && atTop.every(s => s.reps >= repTarget)) return { kg: Math.round((top + step) * 100) / 100, reps: repTarget };
  return { kg: top, reps: best + 1 };
}

/* ---------- audio, vibration, wake lock, speech ---------- */
let ac = null;
function unlockAudio() {
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch {}
}
document.addEventListener('pointerdown', unlockAudio, { passive: true });
function beep() {
  try {
    if (!ac) return;
    [0, 0.18].forEach((off, i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.value = i ? 1320 : 880; g.gain.value = 0.18;
      o.connect(g); g.connect(ac.destination);
      o.start(ac.currentTime + off); o.stop(ac.currentTime + off + 0.14);
    });
  } catch {}
}
const vibrate = p => { try { navigator.vibrate && navigator.vibrate(p); } catch {} };
function say(text) {
  try {
    if (!S.settings.speak || !window.speechSynthesis) return;
    const u = new SpeechSynthesisUtterance(text); u.lang = 'de-DE';

/* ---------- workout logic ---------- */

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  };

}
function handleVoice(text) {

  const t = text.toLowerCase().replace(/(\d)\s*komma\s*(\d)/g, '$1.$2').replace(/(\d),(\d)/g, '$1.$2');
  const nums = t.match(/\d+(?:\.\d+)?/g) || [];
  if (nums.length < 2) return toast(`Nicht verstanden: „${text}“`);

function lineChart(points, unit) {

  const svg = sv('svg', { class: 'chart', viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': `Verlauf: ${points.map(p => p.label + ' ' + fmtKg(p.value) + ' ' + unit).join(', ')}` });
  const defs = sv('defs', {}, sv('linearGradient', { id: 'ga', x1: 0, y1: 0, x2: 0, y2: 1 }, sv('stop', { offset: 0, class: 'area-a' }), sv('stop', { offset: 1, class: 'area-b' })));
  svg.append(defs);

  if (lo === hi) { lo -= 2; hi += 2; }
  const pad = (hi - lo) * 0.12; lo = Math.max(0, lo - pad); hi += pad;

    svg.append(sv('polyline', { class: 'line', points: pts.map(p => p.join(',')).join(' ') }));
  }

  const [ex, ey] = pts[pts.length - 1];
  svg.append(sv('circle', { class: 'end', cx: ex, cy: ey, r: 5.5 }));

  if (points.length > 1) svg.append(sv('text', { x: x(points.length - 1), y: H - 6, 'text-anchor': 'end' }, points[points.length - 1].label));

}
function barChart(bars) {
  const W = 320, H = 168, L = 4, R = 4, T = 22, B = 22;
  const svg = sv('svg', { class: 'chart', viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Volumen pro Woche: ' + bars.map(b => `${b.label} ${fmtTons(b.value)}`).join(', ') });

/* ---------- motivation: muscle map, achievements, celebrations ---------- */
const MUSCLES = { chest: 'Brust', back: 'Rücken', shoulders: 'Schultern', biceps: 'Bizeps', triceps: 'Trizeps', abs: 'Bauch',
  quads: 'Beinvorderseite', hams: 'Beinrückseite', glutes: 'Po', calves: 'Waden', lowback: 'Unterer Rücken' };
const MUSCLE_RULES = [
  [/wade|calf/i, ['calves']],
  [/beinbeuger|leg ?curl|beincurl|nordic/i, ['hams'], ['glutes']],
  [/rumän|rdl|stiff|good ?morning/i, ['hams', 'glutes'], ['lowback']],
  [/kreuzheben|deadlift/i, ['hams', 'glutes', 'lowback'], ['back']],
  [/hip ?thrust|glute|gesäß|abduktor/i, ['glutes'], ['hams']],
  [/kniebeug|squat|beinpresse|leg ?press|ausfallschritt|lunge|bulgar|split|hack|step-?up|beinstrecker|leg ?ext/i, ['quads'], ['glutes']],
  [/bauch|crunch|plank|sit-?up|beinheben|leg ?raise|russian|ab ?roll|hollow/i, ['abs']],
  [/hyperext|rückenstrecker|back ?ext/i, ['lowback'], ['glutes']],
  [/dips/i, ['triceps', 'chest'], ['shoulders']],
  [/trizeps|triceps|french|skull|pushdown|kickback/i, ['triceps']],
  [/bizeps|biceps|curl|hammer/i, ['biceps']],
  [/face ?pull|reverse ?fly|rear ?delt|hintere/i, ['shoulders'], ['back']],
  [/seitheben|lateral|frontheben|front ?raise|arnold|schulter|shoulder|military|overhead|ohp|nackendrücken|upright/i, ['shoulders'], ['triceps']],
  [/klimmz|pull-?up|chin|lat|rudern|row|t-?bar|pullover|shrug/i, ['back'], ['biceps']],
  [/bank|brust|bench|chest|fliegend|butterfly|fly|liegestütz|push-?up|cross/i, ['chest'], ['triceps', 'shoulders']],
];
function musclesOf(name) {
  for (const [re, p, sec2] of MUSCLE_RULES) if (re.test(name)) return { p, s: sec2 || [] };
  return null;
}
function muscleLoad(days = 7) {
  const since = Date.now() - days * 864e5, load = Object.fromEntries(Object.keys(MUSCLES).map(k => [k, 0])), unknown = new Set();
  const sets = S.workouts.filter(w => w.start >= since).flatMap(w => w.sets).concat(S.active ? S.active.sets : []);
  for (const st of sets) {
    const m = musclesOf(st.ex);
    if (!m) { unknown.add(st.ex); continue; }
    m.p.forEach(k => { load[k] += 1; });
    m.s.forEach(k => { load[k] += .5; });
  }
  return { load, unknown: [...unknown], any: sets.length > 0 };
}
const mLevel = n => n <= 0 ? 'l0' : n < 4 ? 'l1' : n < 10 ? 'l2' : 'l3';
const GROUPS = [['Brust', ['chest']], ['Rücken', ['back']], ['Schultern', ['shoulders']], ['Beine', ['quads', 'hams', 'glutes']], ['Arme', ['biceps', 'triceps']]];

function heroHint() {
  const { load, any } = muscleLoad();
  if (!any) return null;
  const miss = GROUPS.filter(([, ks]) => ks.every(k => load[k] <= 0)).map(([n]) => n);
  return h('div', { class: 'hhint' + (miss.length ? '' : ' ok') },
    miss.length ? ['Zu kurz in den letzten 7 Tagen: ', h('b', {}, miss.join(' · '))] : 'Alle großen Muskelgruppen waren in den letzten 7 Tagen dran.');
}

  { id: 's8', icon: I.bolt, t: 'Unaufhaltsam', d: '8 Wochen Serie', p: s => [s.streak, 8] },
  { id: 'pr1', icon: I.trophy, t: 'Erster Rekord', d: 'Einen persönlichen Rekord aufgestellt', p: s => [s.prs, 1] },

  { id: 'all', icon: I.star, t: 'Allrounder', d: 'Alle Pläne in einer Woche trainiert', p: s => [s.allPlans ? 1 : 0, 1] },

function achStats() {
  const ws = S.workouts, all = S.active ? [{ start: S.active.start, sets: S.active.sets }, ...ws] : ws;
  const sets = all.flatMap(w => w.sets), perWeek = new Map(), plansByWeek = new Map();
  ws.forEach(w => {
    const k = weekStart(w.start);
    perWeek.set(k, (perWeek.get(k) || 0) + 1);
    if (!plansByWeek.has(k)) plansByWeek.set(k, new Set());
    plansByWeek.get(k).add(w.plan);
  });
  const planNames = S.plans.filter(p => p.exercises.length).map(p => p.name);
  return {
    n: ws.length, streak: streak(), bestWeek: Math.max(0, ...perWeek.values()), prs: sets.filter(x => x.pr).length,
    maxKg: Math.max(0, ...sets.map(x => x.kg)), maxVol: Math.max(0, ...all.map(w => volume(w.sets))), totalVol: volume(sets),
    legs: sets.some(x => { const m = musclesOf(x.ex); return m && m.p.some(k => k === 'quads' || k === 'hams' || k === 'glutes'); }),
    early: ws.some(w => new Date(w.start).getHours() < 7), night: ws.some(w => new Date(w.start).getHours() >= 21),
    allPlans: planNames.length >= 2 && [...plansByWeek.values()].some(set => planNames.every(n => set.has(n))),
  };
}
function checkAchievements(announce = true) {
  const st = achStats(), fresh = [];
  for (const a of ACH) {
    if (S.ach[a.id]) continue;
    const [cur, goal] = a.p(st);
    if (cur >= goal) { S.ach[a.id] = Date.now(); fresh.push(a); }
  }
  if (fresh.length) {
    save();
    if (announce) fresh.forEach(a => celebrate({ kind: 'ach', icon: a.icon, kicker: 'Erfolg freigeschaltet', title: a.t, sub: a.d }));
  }
  return fresh;
}
function achievementsPanel() {
  const st = achStats(), got = ACH.filter(a => S.ach[a.id]).length, nf = new Intl.NumberFormat('de-DE');
  return [sec('Erfolge', `${got} / ${ACH.length}`), h('section', { class: 'panel' }, h('div', { class: 'achs' }, ACH.map(a => {
    const on = !!S.ach[a.id], [cur, goal] = a.p(st);
    return h('div', { class: 'ach' + (on ? ' on' : '') },
      h('div', { class: 'ach-ic' }, icon(on ? a.icon : I.lock, 20)), h('b', {}, a.t), h('span', {}, a.d),
      on ? h('small', {}, `Seit ${new Date(S.ach[a.id]).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: '2-digit' })}`)
        : goal > 1 ? [h('div', { class: 'ach-bar' }, h('i', { style: `width:${Math.round(Math.min(1, cur / goal) * 100)}%` })), h('small', {}, `${nf.format(Math.min(cur, goal))} / ${nf.format(goal)}`)]
          : h('small', {}, 'Noch offen'));
  })))];
}

const celQueue = [];
let celOn = false;
function celebrate(c) { celQueue.push(c); if (!celOn) nextCelebration(); }
function nextCelebration() {
  const c = celQueue.shift(), el = document.getElementById('celebrate');
  if (!c) { celOn = false; return; }
  celOn = true;
  el.className = 'celebrate k-' + c.kind;
  el.replaceChildren(h('canvas', { class: 'burst', 'aria-hidden': 'true' }), h('div', { class: 'cel-card' },
    h('div', { class: 'cel-icon' }, icon(c.icon, 48)), h('div', { class: 'cel-kick' }, c.kicker),
    h('div', { class: 'cel-title' }, c.title), h('div', { class: 'cel-sub' }, c.sub), c.detail && h('div', { class: 'cel-detail' }, c.detail)));
  el.hidden = false;
  requestAnimationFrame(() => el.classList.add('on'));
  fanfare(c.kind);
  vibrate(c.kind === 'pr' ? [60, 40, 60, 40, 180] : [40, 30, 120]);
  burst(el.querySelector('canvas'), c.kind);
  let done = false;
  const close = () => { if (done) return; done = true; el.classList.remove('on'); setTimeout(() => { el.hidden = true; nextCelebration(); }, 280); };
  setTimeout(close, c.kind === 'pr' ? 2800 : 3200);
  el.onclick = close;
}
function fanfare(kind) {
  try {
    if (!ac) return;
    const notes = kind === 'pr' ? [523.25, 659.25, 783.99, 1046.5] : [659.25, 987.77, 1318.5];
    notes.forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + i * .1;
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.18, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + .4);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + .42);
    });
  } catch {}
}
function burst(cv, kind) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1), W = innerWidth, H = innerHeight, ctx = cv.getContext('2d');
  cv.width = W * dpr; cv.height = H * dpr; ctx.scale(dpr, dpr);
  const cols = kind === 'pr' ? ['#e0b04a', '#f3d58e', '#b88a1e', '#2c5bff'] : ['#2c5bff', '#8aa4ff', '#38c983', '#e0b04a'];
  const ps = Array.from({ length: 120 }, () => {
    const a = Math.random() * Math.PI * 2, v = 3 + Math.random() * 8;
    return { x: W / 2, y: H * .4, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 3, r: 1.5 + Math.random() * 3.2, c: cols[Math.random() * cols.length | 0] };
  });
  const t0 = performance.now();
  (function step(now) {
    const k = (now - t0) / 1700;
    ctx.clearRect(0, 0, W, H);
    if (k >= 1 || !cv.isConnected) return;
    ctx.globalAlpha = 1 - k * k;
    for (const q of ps) {
      q.x += q.vx; q.y += q.vy; q.vy += .2; q.vx *= .985;
      ctx.fillStyle = q.c; ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, Math.PI * 2); ctx.fill();
    }
    requestAnimationFrame(step);
  })(t0);
}

/* ---------- app shell ---------- */
const $main = document.getElementById('main');
function render() {
  const views = { heute: viewHeute, plaene: viewPlaene, verlauf: viewVerlauf, fortschritt: viewFortschritt };
  $main.replaceChildren(...[].concat(views[tab]()).filter(Boolean));
  document.querySelectorAll('.dock button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === tab ? 'page' : 'false'));
  document.getElementById('live').hidden = !S.active;
  const now = Date.now();
  document.getElementById('title').textContent = S.active && tab === 'heute' ? 'Training' : { heute: 'Heute', plaene: 'Pläne', verlauf: 'Verlauf', fortschritt: 'Fortschritt' }[tab];
  document.getElementById('today').textContent = `${new Date(now).toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' })} · KW ${isoWeek(now)}`;
  if (S.active) tick();
}
document.querySelectorAll('.dock button').forEach(b => b.addEventListener('click', () => { tab = b.dataset.tab; render(); window.scrollTo(0, 0); }));

if (!S.achInit) { checkAchievements(false); S.achInit = true; save(); }
render();
if (S.active) { startTicker(); wake(); }

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
